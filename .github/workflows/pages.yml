name: Deploy Te Ara Hauora to GitHub Pages

on:
  push:
    branches: [claude/fitness-tracker-samsung-b2d1bu]
    paths:
      - "fitness-tracker/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add .nojekyll
        run: touch fitness-tracker/.nojekyll
      - name: Publish fitness-tracker to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fitness-tracker
          publish_branch: gh-pages
