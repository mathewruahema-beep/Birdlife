name: Deploy Te Ara Hauora to GitHub Pages

on:
  push:
    branches: [claude/fitness-tracker-samsung-b2d1bu]
    paths:
      - "fitness-tracker/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fitness-tracker
      - id: deployment
        uses: actions/deploy-pages@v4
