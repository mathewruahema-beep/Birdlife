<style>

<script>
const LAYERS = {
  kernel:   {name:'Kernel',            c:'#ffd66b', what:'Loads into every session. The charter and the map.'},
  doctrine: {name:'Doctrine',          c:'#b48cff', what:'birdlife-core: precedence, fact classes, write tiers, verification queries.'},
  system:   {name:'System skills',     c:'#35d7ff', what:'One skill per system, with a facts file of IDs and values.'},
  deep:     {name:'Salesforce deep dives', c:'#4d8dff', what:'Payments2Us, Conga, S-Docs, MoveData, Power BI.'},
  cross:    {name:'Cross-cutting skills', c:'#2ee6c5', what:'Workflow, security, people, reporting, improvement, prompting, manager, voice, OS.'},
  connskill:{name:'Connector skills',  c:'#6fe38a', what:'What each small connector reaches and the boundary.'},
  memory:   {name:'Memory',            c:'#ffa63d', what:'The journal (what happened, by whom) and the patterns (symptom, cause, fix).'},
  os:       {name:'OS and registers',  c:'#ff5fb7', what:'Rules, the state of record, the lens model, the console source.'},
  routines: {name:'Routines',          c:'#ff7a45', what:'Unattended work on schedules; budget of twelve.'},
  decisions:{name:'Decisions (ADRs)',  c:'#c8f04c', what:'Append-only, never edited, superseded by a new dated entry.'},
  live:     {name:'Live systems',      c:'#ff5c5c', what:'Connectors. A live query beats every stored fact.'},
  artefacts:{name:'Artefacts',         c:'#f08cff', what:'Published pages: the console, dashboards, the department suite.'},
  copy:     {name:'Human copy',        c:'#8aa4c8', what:'Where the brain is mirrored for people: Google Drive, the account, a local clone.'},
};
const order=['kernel','doctrine','os','memory','system','deep','cross','connskill','routines','decisions','live','artefacts','copy'];
const short = s => s.replace(/^birdlife-/,'').replace('google-workspace-expert','google-workspace');
const RING_R=[0,120,300,440,580];
let N=[], E=[], byId={}, adj={}, rings={};
function add(n){ N.push(n); byId[n.id]=n; return n; }
function link(a,b,label){ if(byId[a]&&byId[b]&&a!==b) E.push({a,b,label}); }

// ---------- what the repository is read for ----------
const OWNER='mathewruahema-beep', REPO='Birdlife', SERVER='github', TOOL='get_file_contents';
const DEFAULT_REF='claude/birdlife-brain-build-02zobt';
const READS={
  charter:  {path:'CLAUDE.md', kind:'file', why:'the charter and its skill table'},
  index:    {path:'INDEX.md', kind:'file', why:'what is known where'},
  registers:{path:'os/registers.md', kind:'file', why:'routines, connectors, artefacts'},
  osdir:    {path:'os', kind:'dir', why:'the OS files'},
  skills:   {path:'.claude/skills', kind:'dir', why:'the skill list'},
  journal:  {path:'memory/journal', kind:'dir', why:'the journal'},
  patterns: {path:'memory/patterns', kind:'dir', why:'the patterns'},
  adrs:     {path:'.claude/skills/birdlife-core/references/decisions', kind:'dir', why:'the decision log'},
};
const SKILL_LAYER={ 'birdlife-asana':'system','birdlife-cloudflare':'system','birdlife-microsoft365':'system','birdlife-netsuite':'system','birdlife-salesforce':'system','birdlife-stripe':'system','birdlife-wordpress':'system','birdlife-wpengine':'system','birdlife-zapier':'system','google-workspace-expert':'system',
  'birdlife-conga':'deep','birdlife-movedata':'deep','birdlife-payments2us':'deep','birdlife-powerbi':'deep','birdlife-sdocs':'deep',
  'birdlife-atlassian':'connskill','birdlife-canva':'connskill','birdlife-gmail':'connskill','birdlife-google-calendar':'connskill','birdlife-granola':'connskill','birdlife-microsoft-learn':'connskill','birdlife-miro':'connskill' };
const USES={
 'birdlife-salesforce':['Salesforce Production','Salesforce Staging'],'birdlife-ict-assistant':['Salesforce Production','Asana','Microsoft 365'],
 'birdlife-payments2us':['Salesforce Production'],'birdlife-conga':['Salesforce Production'],'birdlife-sdocs':['Salesforce Production','Salesforce Staging'],'birdlife-movedata':['Salesforce Production'],'birdlife-powerbi':['Salesforce Production'],
 'birdlife-security':['Salesforce Production','Microsoft 365'],'birdlife-people-lifecycle':['Salesforce Production','Microsoft 365','Asana'],'birdlife-reporting':['Salesforce Production','Stripe','NetSuite','Microsoft 365'],
 'birdlife-manager':['Salesforce Production','Asana'],'birdlife-improvement':['Asana'],'birdlife-asana':['Asana'],'birdlife-microsoft365':['Microsoft 365'],
 'birdlife-netsuite':['NetSuite'],'birdlife-stripe':['Stripe'],'birdlife-zapier':['Zapier'],'birdlife-cloudflare':['Cloudflare'],'birdlife-wordpress':['BirdLife UAT WordPress'],
 'google-workspace-expert':['Google Drive'],'birdlife-atlassian':['Atlassian Rovo'],'birdlife-canva':['Canva'],'birdlife-miro':['Miro'],'birdlife-granola':['Granola'],'birdlife-gmail':['Gmail'],'birdlife-google-calendar':['Google Calendar'],'birdlife-microsoft-learn':['Microsoft Learn'],
 'birdlife-os':['GitHub'],'email-voice':['Microsoft 365'],'morning':['Google Drive','Google Calendar'],
};
const MENTIONS=[[/salesforce|zeus|\bcases?\b|offboard|onboard|pre-draft/i,'Salesforce Production'],[/asana|board|membership|briefing/i,'Asana'],[/teams|sharepoint|outlook|microsoft 365|entra/i,'Microsoft 365'],[/gmail/i,'Gmail'],[/zapier/i,'Zapier'],[/stripe|refund/i,'Stripe'],[/github|repo\b|repository/i,'GitHub'],[/netsuite/i,'NetSuite'],[/wordpress|website/i,'BirdLife UAT WordPress']];
const OS_DESC={'README.md':['OS rules','The Claude operating system: estate model, ten rules, cadence, change control, incident handling.'],'registers.md':['registers','State of record: routines, skills, connectors, artefacts, credential watchlist, memory, decisions.'],'lenses.md':['lenses','IT-GOV-004 lens model: five lenses, the IT Admin capability matrix, findings F1 to F6.'],'claude-os-overview.html':['console source','Source of the BirdLife Australia console (Jarvis).'],'birdlife-brain.html':['this map','Source of this page. It reads the repository through the viewer\u2019s GitHub connector at every open.']};

// ---------- parsing the repository ----------
function fileText(result){
  let text=null, sha=null;
  for(const b of (result&&result.content||[])){
    if(b.type==='resource' && b.resource && typeof b.resource.text==='string'){ text=b.resource.text; const m=/\/sha\/([0-9a-f]{7,40})\//.exec(b.resource.uri||''); if(m) sha=m[1]; }
    else if(b.type==='text' && typeof b.text==='string'){ const m=/^\[Resource from [^\]]*?\/sha\/([0-9a-f]{7,40})\/[^\]]*\]\s*/.exec(b.text); if(m){ sha=m[1]; text=b.text.slice(m[0].length); } }
  }
  if(text===null && result && typeof result.payload==='string' && !/^successfully downloaded/i.test(result.payload)) text=result.payload;
  return {text, sha};
}
function dirList(result){
  let p=result&&result.payload; if(typeof p==='string'){ try{ p=JSON.parse(p);}catch(e){ p=null; } }
  if(!Array.isArray(p)) for(const b of (result&&result.content||[])){ if(b.type==='text'){ try{ const j=JSON.parse(b.text); if(Array.isArray(j)){ p=j; break; } }catch(e){} } }
  return Array.isArray(p)?p:[];
}
function tableAfter(md, headingRe){
  const lines=md.split('\n'); let i=lines.findIndex(l=>headingRe.test(l)); if(i<0) return [];
  const rows=[]; let inT=false;
  for(i=i+1;i<lines.length;i++){ const l=lines[i]; if(/^#{2,3}\s/.test(l)) break;
    if(/^\|/.test(l)){ if(/^\|\s*:?-{2,}/.test(l)){ inT=true; continue; } if(inT) rows.push(l.split('|').slice(1,-1).map(c=>c.trim())); }
    else if(inT && rows.length) break; }
  return rows;
}
function section(md, startRe, endRe){ const a=md.search(startRe); if(a<0) return ''; const rest=md.slice(a); const b=rest.slice(1).search(endRe); return b<0?rest:rest.slice(0,b+1); }
const strip=s=>String(s).replace(/`/g,'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
const clip=(s,n)=>{ s=strip(s); return s.length>n? s.slice(0,n-1).replace(/\s\S*$/,'')+'\u2026' : s; };

// ---------- graph assembly from live reads ----------
function buildGraph(R){
  N=[]; E=[]; byId={}; adj={}; rings={};
  const charter=R.charter&&R.charter.text||'', index=R.index&&R.index.text||'', reg=R.registers&&R.registers.text||'';
  const skillDesc={}; for(const row of tableAfter(charter,/^\|\s*Skill\s*\|/)){ if(row.length<2) continue; for(const m of row[0].matchAll(/`([^`]+)`/g)) skillDesc[m[1]]=strip(row[1]); }
  const indexDesc={}; for(const l of index.split('\n')){ const m=/^\|\s*`([^`]+)`\s*\|\s*(.+?)\s*\|\s*$/.exec(l); if(m) indexDesc[m[1]]=strip(m[2]); }

  add({id:'CLAUDE.md',label:'CLAUDE.md',layer:'kernel',ring:0,desc: indexDesc['CLAUDE.md']||'The charter. Identity, the operating rules, the session close rule, the skill table. Loads into every session on the repository.',path:'CLAUDE.md',file:true, present:!!charter});
  add({id:'INDEX.md',label:'INDEX',layer:'kernel',ring:1,desc:'One line per file: what is known where.',path:'INDEX.md',file:true, present:!!index});
  link('INDEX.md','CLAUDE.md','maps');
  const skills=(R.skills&&R.skills.list||[]).filter(e=>e.type==='dir').map(e=>e.name);
  if(skills.includes('birdlife-core')){ add({id:'birdlife-core',label:'birdlife-core',layer:'doctrine',ring:1,desc:skillDesc['birdlife-core']||'The doctrine underneath everything.',path:'.claude/skills/birdlife-core/SKILL.md',file:true}); link('birdlife-core','CLAUDE.md','doctrine under'); }
  const osFiles=(R.osdir&&R.osdir.list||[]).filter(e=>e.type==='file').map(e=>e.name);
  for(const f of osFiles){ const d=OS_DESC[f]||[f.replace(/\.(md|html)$/,''),indexDesc['os/'+f]||'File in os/.']; add({id:'os/'+f,label:d[0],layer:'os',ring:1,desc:indexDesc['os/'+f]||d[1],path:'os/'+f,file:true}); }
  link('os/README.md','CLAUDE.md','governs'); link('os/registers.md','os/README.md','state of'); link('os/lenses.md','os/README.md','tiers'); link('os/claude-os-overview.html','os/registers.md','mirrors'); link('os/birdlife-brain.html','os/registers.md','reads');
  add({id:'memory/README.md',label:'memory rules',layer:'memory',ring:1,desc:indexDesc['memory/README.md']||'Who writes to memory, the journal and pattern formats, no credentials, no PII.',path:'memory/README.md',file:true}); link('memory/README.md','CLAUDE.md','session close');

  for(const s of skills){ if(s==='birdlife-core') continue; const layer=SKILL_LAYER[s]||'cross';
    add({id:s,label:short(s),layer,ring:2,desc:skillDesc[s]||'Skill folder in the repository. No row in the charter\u2019s skill table yet: add one.',path:'.claude/skills/'+s+'/SKILL.md',file:true, orphan:!skillDesc[s]});
    link(s,'birdlife-core','reads first'); }

  const journals=(R.journal&&R.journal.list||[]).filter(e=>e.type==='file'&&/\.md$/.test(e.name)).map(e=>e.name.replace(/\.md$/,'')).sort();
  for(const j of journals){ add({id:'journal/'+j,label:j,layer:'memory',ring:3,desc:'Journal for '+j+': decisions and by whom, work done, lessons, open items.',path:'memory/journal/'+j+'.md',file:true}); link('journal/'+j,'memory/README.md','entry'); link('journal/'+j,'CLAUDE.md','record'); }
  const patterns=(R.patterns&&R.patterns.list||[]).filter(e=>e.type==='file'&&/\.md$/.test(e.name)).map(e=>e.name.replace(/\.md$/,''));
  const PAT={salesforce:'birdlife-salesforce',website:'birdlife-wordpress','claude-estate':'birdlife-os',microsoft365:'birdlife-microsoft365',money:'birdlife-netsuite'};
  for(const p of patterns){ add({id:'pattern/'+p,label:'pattern: '+p,layer:'memory',ring:3,desc:'Resolved problems for '+p+': symptom, cause, fix, verify, doctrine.',path:'memory/patterns/'+p+'.md',file:true}); const t=PAT[p]||('birdlife-'+p); if(byId[t]) link('pattern/'+p,t,'doctrine'); else link('pattern/'+p,'memory/README.md','pattern'); }

  const adrs=(R.adrs&&R.adrs.list||[]).filter(e=>e.type==='file'&&/\.md$/.test(e.name)).map(e=>e.name.replace(/\.md$/,'')).sort();
  for(const a of adrs){ const num=a.slice(0,4); add({id:'adr/'+a,label:'ADR '+num,layer:'decisions',ring:3,desc:'ADR '+num+': '+a.slice(5).replace(/-/g,' ')+'. Click loads the title from the file.',path:'.claude/skills/birdlife-core/references/decisions/'+a+'.md',file:true}); if(byId['birdlife-core']) link('adr/'+a,'birdlife-core','recorded in'); }

  // live systems from the connector register
  const conn=section(reg,/^## 3\. Connector register/m,/^## \d/m); const live=[]; const seen=new Set();

    unsubs.push(mcp.watchTool(SERVER,TOOL,input,ev=>{ if(ev.type==='data'){ results[k]=ev.result; delete errors[k]; } else { errors[k]=ev.error; if(/needs_reauth|server_not_connected|blocked_by_policy|approval_required|not_in_manifest|consent_required/.test(ev.error.code)) delete results[k]; } scheduleRebuild(); },{cache:{staleTime:60000,gcTime:3600000},refetchInterval:300000})); }
}
document.getElementById('reload').onclick=()=>{ const v=refEl.value.trim(); if(v && v!==REF){ REF=v; try{ localStorage.setItem('brain.ref',REF); }catch(e){} } if(!mcp){ offlineGraph(); return; } mcp.invalidate(SERVER,TOOL).catch(()=>{}).then(watchAll); };
refEl.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('reload').click(); });

offlineGraph(); statusEl.innerHTML='Connecting to GitHub\u2026';
(async()=>{
  if(!window.claude || typeof window.claude.use!=='function'){ statusEl.innerHTML='Not inside claude.ai: nothing can be read.'; banner('Open this page in claude.ai','<p>The map reads the repository through your GitHub connector. A saved copy or another host has no connector, so only the structure shows.</p>'); return; }
  mcp=await window.claude.use('mcp');
  if(!mcp){ statusEl.innerHTML='No connector access in this view.'; banner('Connectors are not available here','<p>This view cannot run the GitHub connector, so the repository has not been read. Open the artifact in claude.ai and allow GitHub when asked.</p>'); return; }
  watchAll();
})();
</script>
