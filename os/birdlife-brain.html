<style>
:root{
  --ground:#04070e; --ground-2:#080d18; --line:rgba(53,215,255,.14); --fg:#d9e6f5; --fg-dim:#7f93ad; --fg-faint:#4a5b73;

}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}

.brand{display:flex;flex-direction:column;gap:6px;max-width:min(520px,80vw)}
.eyebrow{font-family:var(--display);font-size:10px;letter-spacing:.28em;color:var(--holo);text-transform:uppercase;opacity:.85}

.tools{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.search{display:flex;align-items:center;gap:8px;background:rgba(8,13,24,.82);border:1px solid var(--line);padding:8px 12px;backdrop-filter:blur(6px)}
.search label{font-family:var(--display);font-size:9px;letter-spacing:.22em;color:var(--fg-dim);text-transform:uppercase}
.search input{background:transparent;border:0;color:var(--fg);font-family:var(--mono);font-size:13px;width:200px;outline:none}

.legend .key{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--fg-dim)}
.legend .key span{display:inline-flex;align-items:center;gap:5px}
.legend .key i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--holo);display:inline-block}

<script>
// ---------- layers, mapped onto the lobes ----------
const LAYERS = {
  kernel:   {name:'Kernel',               lobe:'thalamus',            c:'#ffd66b', what:'CLAUDE.md. Loads into every session, relays everything.'},
  doctrine: {name:'Doctrine',             lobe:'basal ganglia',       c:'#b48cff', what:'birdlife-core: precedence, fact classes, write tiers.'},
  os:       {name:'OS and registers',     lobe:'basal ganglia',       c:'#ff5fb7', what:'Rules, the state of record, the lens model, page sources.'},
  decisions:{name:'Decisions (ADRs)',     lobe:'prefrontal cortex',   c:'#c8f04c', what:'Judgement. Append-only, never edited.'},
  cross:    {name:'Cross-cutting skills', lobe:'frontal lobe',        c:'#2ee6c5', what:'Executive function: workflow, security, people, reporting, manager, voice.'},
  system:   {name:'System skills',        lobe:'parietal lobe',       c:'#35d7ff', what:'Integration: one skill per system with its facts.'},
  deep:     {name:'Salesforce deep dives',lobe:'parietal, rear',      c:'#4d8dff', what:'Payments2Us, Conga, S-Docs, MoveData, Power BI.'},
  connskill:{name:'Connector skills',     lobe:'insula',              c:'#6fe38a', what:'What each small connector reaches and its boundary.'},
  memory:   {name:'Memory',               lobe:'temporal lobe',       c:'#ffa63d', what:'Journal (what happened) and patterns (what was fixed).'},
  artefacts:{name:'Artefacts',            lobe:'occipital lobe',      c:'#f08cff', what:'What the brain shows: console, dashboards, this map.'},
  routines: {name:'Routines',             lobe:'cerebellum',          c:'#ff7a45', what:'Automatic, scheduled action. Lights when due by schedule.'},
  live:     {name:'Live systems',         lobe:'nerves from the brainstem', c:'#ff5c5c', what:'Connectors. A live query beats every stored fact.'},
  copy:     {name:'Human copy',           lobe:'outside the skull',   c:'#8aa4c8', what:'Google Drive, the account, the local clone.'},
};
const order=Object.keys(LAYERS);
const short = s => s.replace(/^birdlife-/,'').replace('google-workspace-expert','google-workspace');
let N=[], E=[], byId={}, adj={};
function add(n){ N.push(n); byId[n.id]=n; return n; }
function link(a,b,label){ if(byId[a]&&byId[b]&&a!==b) E.push({a,b,label}); }

// ---------- brain geometry (brain space 1000 x 760, facing left) ----------
const OUTLINE=[[118,400],[150,300],[215,205],[320,145],[450,118],[590,120],[720,150],[830,215],[895,300],[905,380],[880,450],[830,475],[790,485],[810,530],[790,585],[730,615],[660,605],[615,585],[610,640],[612,720],[560,722],[556,640],[540,585],[470,570],[360,560],[250,540],[170,500],[125,455]];
const CEREBELLUM=[[790,485],[830,500],[845,545],[815,595],[740,620],[665,610],[630,585],[650,540],[700,510],[750,492]];
const SULCI=[ [[540,130],[520,230],[490,330],[470,400]], [[190,430],[300,455],[420,470],[560,475],[610,460]], [[770,175],[750,260],[725,340],[705,400]], [[300,180],[340,260],[330,330]], [[640,150],[660,240],[640,310]], [[250,290],[240,380]], [[430,180],[470,250]], [[820,300],[800,380],[780,440]] ];
const REGION={ // ellipses: cx, cy, rx, ry, rotation
  kernel:{cx:505,cy:400,rx:0,ry:0,rot:0},
  doctrine:{cx:505,cy:400,rx:105,ry:62,rot:0,ring:true},
  os:{cx:505,cy:400,rx:105,ry:62,rot:0,ring:true},
  decisions:{cx:230,cy:335,rx:78,ry:98,rot:-0.35},
  cross:{cx:395,cy:235,rx:125,ry:72,rot:-0.25},
  system:{cx:640,cy:215,rx:135,ry:68,rot:0.2},
  deep:{cx:780,cy:335,rx:62,ry:78,rot:0.1},
  connskill:{cx:335,cy:430,rx:90,ry:42,rot:0.05},
  memory:{cx:400,cy:515,rx:150,ry:34,rot:0.06},
  artefacts:{cx:858,cy:425,rx:38,ry:62,rot:0},
  routines:{cx:735,cy:555,rx:82,ry:42,rot:0},
  live:{arc:true,cx:585,cy:520,r:340,a0:2.35,a1:0.8},
  copy:{cx:150,cy:660,rx:22,ry:48,rot:0},
};
function placeInEllipse(nodes,R,seedOffset){ const G=Math.PI*(3-Math.sqrt(5)); const n=nodes.length; nodes.forEach((nd,i)=>{ const t=(i+0.5)/n, r=Math.sqrt(t)*0.92, a=i*G+seedOffset; const ex=Math.cos(a)*r*R.rx, ey=Math.sin(a)*r*R.ry; nd.bx=R.cx+ex*Math.cos(R.rot)-ey*Math.sin(R.rot); nd.by=R.cy+ex*Math.sin(R.rot)+ey*Math.cos(R.rot); }); }
function layout(){
  const groups={}; for(const n of N){ (groups[n.layer]=groups[n.layer]||[]).push(n); }
  for(const k in groups){ const R=REGION[k], arr=groups[k];
    if(k==='kernel'){ arr.forEach(n=>{ n.bx=R.cx; n.by=R.cy; }); continue; }
    if(R.ring){ const ringNodes=[...(groups.doctrine||[]),...(groups.os||[]),...N.filter(n=>n.layer==='memory'&&n.ring===1)]; ringNodes.forEach((n,i)=>{ const t=(i/ringNodes.length)*Math.PI*2-Math.PI/2; n.bx=R.cx+Math.cos(t)*R.rx; n.by=R.cy+Math.sin(t)*R.ry; }); continue; }
    if(R.arc){ const m=arr.length; arr.forEach((n,i)=>{ const t=R.a0+(R.a1-R.a0)*((i+0.5)/m); n.bx=R.cx+Math.cos(t)*R.r; n.by=R.cy+Math.sin(t)*R.r*0.56; }); continue; }
    if(k==='memory'){ const inner=arr.filter(n=>n.ring===1), outer=arr.filter(n=>n.ring!==1); placeInEllipse(outer,R,0.7); continue; }
    placeInEllipse(arr,R,order.indexOf(k)*1.3);
  }
  adj={}; for(const e of E){ (adj[e.a]=adj[e.a]||new Set()).add(e.b); (adj[e.b]=adj[e.b]||new Set()).add(e.a); }
  if(sel && !byId[sel.id]) select(null); else if(sel) sel=byId[sel.id];
  hover=null;
}

// ---------- what the repository is read for ----------
const OWNER='mathewruahema-beep', REPO='Birdlife', SERVER='GitHub', TOOL='get_file_contents';
const DEFAULT_REF='claude/birdlife-brain-build-02zobt';
const READS={
  charter:  {path:'CLAUDE.md', kind:'file', node:'CLAUDE.md'},
  index:    {path:'INDEX.md', kind:'file', node:'INDEX.md'},
  registers:{path:'os/registers.md', kind:'file', node:'os/registers.md'},
  osdir:    {path:'os', kind:'dir', node:'os/README.md'},
  skills:   {path:'.claude/skills', kind:'dir', node:'birdlife-core'},
  journal:  {path:'memory/journal', kind:'dir', node:'memory/README.md'},
  patterns: {path:'memory/patterns', kind:'dir', node:'memory/README.md'},
  adrs:     {path:'.claude/skills/birdlife-core/references/decisions', kind:'dir', node:'birdlife-core'},
};
const SKILL_LAYER={ 'birdlife-asana':'system','birdlife-cloudflare':'system','birdlife-microsoft365':'system','birdlife-netsuite':'system','birdlife-salesforce':'system','birdlife-stripe':'system','birdlife-wordpress':'system','birdlife-wpengine':'system','birdlife-zapier':'system','google-workspace-expert':'system',
  'birdlife-conga':'deep','birdlife-movedata':'deep','birdlife-payments2us':'deep','birdlife-powerbi':'deep','birdlife-sdocs':'deep',
  'birdlife-atlassian':'connskill','birdlife-canva':'connskill','birdlife-gmail':'connskill','birdlife-google-calendar':'connskill','birdlife-granola':'connskill','birdlife-microsoft-learn':'connskill','birdlife-miro':'connskill' };
const USES={
 'birdlife-salesforce':['Salesforce Production','Salesforce Staging'],'birdlife-ict-assistant':['Salesforce Production','Asana','Microsoft 365'],
 'birdlife-payments2us':['Salesforce Production'],'birdlife-conga':['Salesforce Production'],'birdlife-sdocs':['Salesforce Production','Salesforce Staging'],'birdlife-movedata':['Salesforce Production'],'birdlife-powerbi':['Salesforce Production'],
 'birdlife-security':['Salesforce Production','Microsoft 365'],'birdlife-people-lifecycle':['Salesforce Production','Microsoft 365','Asana'],'birdlife-reporting':['Salesforce Production','Stripe','NetSuite','Microsoft 365'],
 'birdlife-manager':['Salesforce Production','Asana'],'birdlife-improvement':['Asana'],'birdlife-asana':['Asana'],'birdlife-microsoft365':['Microsoft 365'],
 'birdlife-netsuite':['NetSuite'],'birdlife-stripe':['Stripe'],'birdlife-zapier':['Zapier'],'birdlife-cloudflare':['Cloudflare'],'birdlife-wordpress':['BirdLife UAT WordPress'],
 'google-workspace-expert':['Google Drive'],'birdlife-atlassian':['Atlassian Rovo'],'birdlife-canva':['Canva'],'birdlife-miro':['Miro'],'birdlife-granola':['Granola'],'birdlife-gmail':['Gmail'],'birdlife-google-calendar':['Google Calendar'],'birdlife-microsoft-learn':['Microsoft Learn'],
 'birdlife-os':['GitHub'],'email-voice':['Microsoft 365'],'morning':['Google Drive','Google Calendar'],
};
const MENTIONS=[[/salesforce|zeus|\bcases?\b|offboard|onboard|pre-draft/i,'Salesforce Production'],[/asana|board|membership|briefing/i,'Asana'],[/teams|sharepoint|outlook|microsoft 365|entra/i,'Microsoft 365'],[/gmail/i,'Gmail'],[/zapier/i,'Zapier'],[/stripe|refund/i,'Stripe'],[/github|repo\b|repository/i,'GitHub'],[/netsuite/i,'NetSuite'],[/wordpress|website/i,'BirdLife UAT WordPress']];
const OS_DESC={'README.md':['OS rules','The Claude operating system: estate model, ten rules, cadence, change control, incident handling.'],'registers.md':['registers','State of record: routines, skills, connectors, artefacts, credential watchlist, memory, decisions.'],'lenses.md':['lenses','IT-GOV-004 lens model: five lenses, the IT Admin capability matrix, findings F1 to F6.'],'claude-os-overview.html':['console source','Source of the BirdLife Australia console (Jarvis).'],'birdlife-brain.html':['this map','Source of this page. It reads the repository through the viewer\u2019s GitHub connector at every open.']};

// ---------- parsing ----------
function fileText(result){ let text=null, sha=null;
  for(const b of (result&&result.content||[])){
    if(b.type==='resource' && b.resource && typeof b.resource.text==='string'){ text=b.resource.text; const m=/\/sha\/([0-9a-f]{7,40})\//.exec(b.resource.uri||''); if(m) sha=m[1]; }
    else if(b.type==='text' && typeof b.text==='string'){ const m=/^\[Resource from [^\]]*?\/sha\/([0-9a-f]{7,40})\/[^\]]*\]\s*/.exec(b.text); if(m){ sha=m[1]; text=b.text.slice(m[0].length); } } }
  if(text===null && result && typeof result.payload==='string' && !/^successfully downloaded/i.test(result.payload)) text=result.payload;

  for(const e of E){ const a=byId[e.a], b=byId[e.b]; if(!visible(a)||!visible(b)) continue; const A=toScreen(a), B=toScreen(b); const f=sel||hover; const inF=fs && fs.has(a.id) && fs.has(b.id) && (a.id===f.id||b.id===f.id); const ua=useOf(a).level, ub=useOf(b).level; const hot=Math.max(ua,ub); let al = fs ? (inF? .9 : .035) : (e.label==='reads first'? .05 : .12); if(!fs && hot>1) al=.5; if(!fs && hot===1) al=Math.max(al,.22); if(query && !fs){ al = (matches(a)||matches(b)) ? .55 : .03; } const col=LAYERS[(a.ring>b.ring?a:b).layer].c; cx.strokeStyle=col+Math.round(al*255).toString(16).padStart(2,'0'); cx.lineWidth= inF?1.5:(hot>1?1.3:.8); cx.beginPath(); const mx=(A.x+B.x)/2, my=(A.y+B.y)/2; const cxy=toScreen({bx:505,by:400}); const k=.22, qx=mx+(cxy.x-mx)*k, qy=my+(cxy.y-my)*k; cx.moveTo(A.x,A.y); cx.quadraticCurveTo(qx,qy,B.x,B.y); cx.stroke(); }
  // pulses
  for(const p of pulses){ const a=byId[p.e.a], b=byId[p.e.b]; if(!a||!b||!visible(a)||!visible(b)) continue; let A=toScreen(a), B=toScreen(b); if(p.rev){ const t=A; A=B; B=t; } const cxy=toScreen({bx:505,by:400}); const mx=(A.x+B.x)/2, my=(A.y+B.y)/2, k=.22, qx=mx+(cxy.x-mx)*k, qy=my+(cxy.y-my)*k; const t=p.t, u=1-t; const x=u*u*A.x+2*u*t*qx+t*t*B.x, y=u*u*A.y+2*u*t*qy+t*t*B.y; const col=LAYERS[(a.ring>b.ring?a:b).layer].c; const dim = fs && !(fs.has(a.id)&&fs.has(b.id)); cx.globalAlpha=dim?.12:.9; cx.drawImage(sprite(col),x-7,y-7,14,14); cx.globalAlpha=1; }
  // nodes
  const breathe = reduce?1:(1+Math.sin(now/900)*.08);
  for(const n of N){ if(!visible(n)) continue; const P=toScreen(n); const col=LAYERS[n.layer].c; const isF = fs? fs.has(n.id) : true; const m = query? matches(n) : true; const al = (isF && (m||fs)) ? 1 : .18; const use=useOf(n); const base = n.ring===0?10: n.ring===1?5.5: n.layer==='live'?4: n.ring===2?4.2: 3.2; const hotN = n.id===(sel&&sel.id)||n.id===(hover&&hover.id); const rad = base*(hotN?1.5:1)*(use.level===2?1.35:1);
    cx.globalAlpha=al*.9; const g= rad*(use.level===2?4.4:3.2)*breathe; cx.drawImage(sprite(col),P.x-g,P.y-g,g*2,g*2);
    if(use.level>=1 && !reduce){ const ph=((now/1000)+ (n.bx*7+n.by*3)%1)%1; const rr=rad+4+ph*(use.level===2?18:9); cx.globalAlpha=al*(1-ph)*(use.level===2?.9:.45); cx.strokeStyle=col; cx.lineWidth=1.2; cx.beginPath(); cx.arc(P.x,P.y,rr,0,Math.PI*2); cx.stroke(); }
    cx.globalAlpha=al; cx.fillStyle='#ffffff'; cx.beginPath(); cx.arc(P.x,P.y,rad*.55,0,Math.PI*2); cx.fill(); cx.fillStyle=col; cx.globalAlpha=al*.85; cx.beginPath(); cx.arc(P.x,P.y,rad,0,Math.PI*2); cx.fill(); cx.globalAlpha=1; }
  // labels
  const showAll = W>600 || zoom>1.4;
  cx.textBaseline='middle';
  for(const n of N){ if(!visible(n)) continue; const P=toScreen(n); const col=LAYERS[n.layer].c; const isF = fs? fs.has(n.id) : true; const m = query? matches(n) : true; const hotN = n.id===(sel&&sel.id)||n.id===(hover&&hover.id); const use=useOf(n);
    const big = n.ring===0||n.ring===1; if(!showAll && !hotN && !big && use.level<2) continue;
    const txt=(hotN||n.layer!=='routines'&&n.layer!=='decisions')?(n.draw&&!hotN?n.draw:n.label):(n.draw||n.label); const left = n.bx<505 && n.layer!=='live' && n.layer!=='memory' && n.layer!=='routines' && n.layer!=='copy'; const below = n.layer==='live'||n.layer==='memory'||n.layer==='routines';
    cx.font=(hotN||big?'500 ':'')+(n.ring===0?'12.5px ':big?'11px ':n.layer==='decisions'&&!hotN?'8.5px ':'9.5px ')+getComputedStyle(document.body).getPropertyValue('--mono');
    cx.fillStyle=hotN?'#ffffff':(use.level===2?'#ffffff':col); cx.globalAlpha=(isF&&(m||fs))?(big?.95:(use.level?.95:.6)):.12;
    if(n.layer==='live'){ cx.save(); cx.translate(P.x+3,P.y+8); cx.rotate(Math.PI/3); cx.textAlign='left'; cx.fillText(txt,0,0); cx.restore(); }
    else if(n.layer==='routines'){ const i=N.filter(x=>x.layer==='routines').indexOf(n); cx.textAlign='center'; cx.fillText(txt,P.x,P.y+(i%2?11:-10)); }
    else if(below){ cx.textAlign='center'; cx.fillText(txt,P.x,P.y+11); }
    else { cx.textAlign=left?'right':'left'; cx.fillText(txt,P.x+(left?-9:9),P.y); }
    cx.globalAlpha=1; }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---------- interaction ----------
function pick(x,y){ let best=null,bd=14*14; for(const n of N){ if(!visible(n)) continue; const P=toScreen(n); const d=(P.x-x)**2+(P.y-y)**2; if(d<bd){bd=d;best=n;} } return best; }
const tip=document.getElementById('tip'); let drag=null, moved=false;
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y}; moved=false; cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing'); });
cv.addEventListener('pointermove',e=>{ if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; if(moved){ pan.x=drag.px+dx; pan.y=drag.py+dy; } return; } const n=pick(e.clientX,e.clientY); hover=n; if(n){ const u=useOf(n); tip.style.display='block'; tip.style.setProperty('--c',LAYERS[n.layer].c); tip.innerHTML='<span class="k">'+LAYERS[n.layer].name+' · '+LAYERS[n.layer].lobe+'</span><span class="n">'+esc(n.label)+'</span><span class="u">'+esc(u.label)+'</span>'; tip.style.left=Math.min(e.clientX+14,W-290)+'px'; tip.style.top=Math.max(8,e.clientY-10)+'px'; cv.style.cursor='pointer'; } else { tip.style.display='none'; cv.style.cursor='grab'; } });
cv.addEventListener('pointerup',e=>{ cv.classList.remove('grabbing'); if(drag && !moved){ const n=pick(e.clientX,e.clientY); select(n); } drag=null; });
cv.addEventListener('pointerleave',()=>{ hover=null; tip.style.display='none'; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoom=Math.max(.6,Math.min(3,zoom*(e.deltaY<0?1.1:.9))); },{passive:false});
document.getElementById('zin').onclick=()=>zoom=Math.min(3,zoom*1.2);
document.getElementById('zout').onclick=()=>zoom=Math.max(.6,zoom/1.2);
document.getElementById('zfit').onclick=()=>{zoom=1;pan={x:0,y:0};};
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const insp=document.getElementById('insp'), ib=document.getElementById('ib');
let mcp=null, detailSeq=0;
function select(n){ sel=n; if(!n){ insp.classList.remove('open'); return; } const L=LAYERS[n.layer]; insp.style.setProperty('--c',L.c); const nb=[...(adj[n.id]||[])].map(id=>byId[id]).filter(Boolean); nb.sort((a,b)=>order.indexOf(a.layer)-order.indexOf(b.layer)); const use=useOf(n);
  const pathHtml = n.url ? '<a href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.url)+'</a>' : esc(n.path);
  const edgeLabel=m=>{ const e=E.find(x=>(x.a===n.id&&x.b===m.id)||(x.b===n.id&&x.a===m.id)); return e?e.label:''; };
  ib.innerHTML='<div class="kind">'+esc(L.name)+' · '+esc(L.lobe)+'</div><h3>'+esc(n.label)+'</h3><div class="use">'+esc(use.label)+'</div><p>'+esc(n.desc)+'</p><div class="path">'+pathHtml+'</div>'+(n.file?'<div class="detail" id="detail">'+(mcp?'Reading the file\u2026':'')+'</div>':'')+(nb.length?'<div class="kind" style="margin:8px 0 6px">Connected ('+nb.length+')</div><div class="links">'+nb.map(m=>'<button data-id="'+esc(m.id)+'" style="--c:'+LAYERS[m.layer].c+'"><i></i>'+esc(m.label)+'<small>'+esc(edgeLabel(m))+'</small></button>').join('')+'</div>':'');
  insp.classList.add('open'); ib.querySelectorAll('.links button').forEach(b=>b.onclick=()=>select(byId[b.dataset.id]));
  if(n.file && mcp){ const seq=++detailSeq; touch(n.id,'read','reading '+n.path); if(byId['sys/GitHub']) activity['sys/GitHub']={t:performance.now(),kind:'read'};
    mcp.callTool(SERVER,TOOL,{owner:OWNER,repo:REPO,path:n.path,ref:'refs/heads/'+REF},{cache:{staleTime:300000}}).then(res=>{ if(seq!==detailSeq) return; const d=document.getElementById('detail'); if(!d) return; const {text}=fileText(res); if(text==null){ d.textContent='The connector answered but sent no text for this file.'; return; } const lines=text.split('\n'); const h=lines.find(l=>/^#\s/.test(l)); const body=lines.filter(l=>l.trim()&&!/^#/.test(l)&&!/^---/.test(l)&&!/^\|/.test(l)).slice(0,3).join(' '); d.innerHTML=(h?'<b>'+esc(strip(h.replace(/^#\s*/,'')))+'</b>\n':'')+esc(clip(body,380))+'\n<span style="color:var(--fg-faint)">'+lines.length+' lines \u00b7 '+(res.cache?'cached '+new Date(res.cache.storedAt).toLocaleTimeString():'read just now')+'</span>'; touch(n.id,'read','read '+n.path+' ('+lines.length+' lines)'); }).catch(err=>{ if(seq!==detailSeq) return; const d=document.getElementById('detail'); if(d) d.textContent=explain(err); touch(n.id,'error','failed '+n.path+': '+(err.code||'')); }); } }
document.getElementById('ic').onclick=()=>select(null);
addEventListener('keydown',e=>{ if(e.key==='Escape') select(null); });

// ---------- HUD ----------
const legend=document.getElementById('legend');
function renderHud(){ const counts={}; for(const n of N) counts[n.layer]=(counts[n.layer]||0)+1;
  legend.innerHTML='<h2>Layers by lobe \u00b7 click to isolate</h2>'+order.map(k=>'<button class="lg" data-k="'+k+'" style="--c:'+LAYERS[k].c+'" title="'+esc(LAYERS[k].what)+'"><i></i><span>'+esc(LAYERS[k].name)+'<small>'+esc(LAYERS[k].lobe)+'</small></span><em>'+(counts[k]||0)+'</em></button>').join('')+'<div class="key"><span><i class="h"></i>in use now</span><span><i></i>used this hour</span><span><i class="d"></i>idle</span></div><div class="foot">Drag to pan, wheel to zoom, click a node. Pulses follow the reads. A ring means the node is in use: being read by this page, or due by its schedule.</div>';
  legend.querySelectorAll('.lg').forEach(b=>{ b.classList.toggle('off',!!off[b.dataset.k]); b.onclick=()=>{ const k=b.dataset.k; const anyOff=Object.values(off).some(v=>v); const onlyThis = !off[k] && Object.keys(LAYERS).filter(x=>x!==k).every(x=>off[x]); if(onlyThis){ for(const x in LAYERS) off[x]=false; } else if(!anyOff){ for(const x in LAYERS) off[x]=x!==k; } else { off[k]=!off[k]; } legend.querySelectorAll('.lg').forEach(x=>x.classList.toggle('off',!!off[x.dataset.k])); if(sel && off[sel.layer]) select(null); }; }); }
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); });
const statusEl=document.getElementById('status'), subEl=document.getElementById('sub'), bannerEl=document.getElementById('banner'), refEl=document.getElementById('ref'), clockEl=document.getElementById('clock');
setInterval(()=>{ clockEl.textContent=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())+' Melb'; },1000);
function banner(title, html){ if(!title){ bannerEl.hidden=true; return; } bannerEl.innerHTML='<h4>'+esc(title)+'</h4>'+html+'<div class="row"><button class="dismiss" type="button" id="bconnect">Connect GitHub</button><button class="dismiss" type="button" id="bdiag">Diagnose</button><button class="dismiss" type="button">Dismiss</button></div><pre id="diag" hidden></pre>'; bannerEl.hidden=false; bannerEl.querySelectorAll('.dismiss').forEach(b=>{ if(!b.id) b.onclick=()=>{ bannerEl.hidden=true; }; }); document.getElementById('bconnect').onclick=connectGitHub; document.getElementById('bdiag').onclick=diagnose; }
async function connectGitHub(){ if(!window.claude||!window.claude.use) return; const perms=await window.claude.use('permissions'); if(perms&&perms.request){ try{ await perms.request(['mcp:'+SERVER]); }catch(e){} } if(!mcp) mcp=await window.claude.use('mcp'); if(mcp) watchAll(); }
async function diagnose(){ const out=[]; try{ const perms=window.claude&&window.claude.use? await window.claude.use('permissions'):null; if(perms){ const st=await perms.state('mcp:'+SERVER).catch(()=>'unavailable'); out.push('permission mcp:'+SERVER+' = '+st); } }catch(e){ out.push('permissions: '+(e&&e.message||e)); }
  if(!mcp) out.push('mcp namespace: not available in this view'); else { try{ const lt=await mcp.listTools(); if(!lt.servers.length) out.push('connectors reachable: none'); for(const sv of lt.servers) out.push('connector "'+sv.server+'": auth '+sv.authStatus+', tools '+(sv.tools.map(t=>t.name).join(', ')||'none')); }catch(e){ out.push('listTools: '+(e.code||'')+' '+(e.message||'')); } }
  out.push('branch: '+REF); for(const k in READS){ if(errors[k]) out.push('read '+READS[k].path+': '+errors[k].code+' '+(errors[k].message||'').slice(0,160)); else if(results[k]) out.push('read '+READS[k].path+': ok'+(READS[k].kind==='file'&&fileText(results[k]).text==null?' but no text decoded (blocks: '+(results[k].content||[]).map(b=>b.type).join(',')+')':'')); else out.push('read '+READS[k].path+': pending'); }
  const d=document.getElementById('diag'); if(d){ d.textContent=out.join('\n'); d.hidden=false; } }
function explain(err){ const c=err&&err.code||'upstream_error'; const M={
  needs_reauth:'GitHub needs reconnecting: claude.ai Settings, Connectors.', server_not_connected:'Add the GitHub connector in claude.ai Settings, Connectors, then reload.', selection_required:'More than one GitHub connector is connected; choose one when claude.ai asks, then reload.',
  not_in_manifest:'This page was not allowed to use GitHub for this view. Allow it when asked, or in the page\u2019s connector settings.', blocked_by_policy:'Organisation policy blocks this GitHub tool for you.', approval_required:'Organisation policy wants per-call approval, which pages cannot do yet.',
  tool_error: /404/.test(err.message||'') ? 'GitHub says 404 for this repository or branch. The repository is private, so the credential behind the GitHub connector must be able to see Birdlife. Grant the app repository access in GitHub (Settings, Applications), or connect a custom GitHub connector with an OAuth app that has the repo scope. Then Reload.' : 'GitHub answered with an error: '+(err.message||'')+' Check the branch name.',
  server_unavailable:'GitHub did not answer in time. Reload in a moment.', rate_limited:'Too many reads in a short time. Wait a little, then reload.', consent_required:'Allow this page to use GitHub, then reload.', not_granted:'This view has no connector access.', capability_disabled:'This view cannot run connectors.' };
  return M[c]||('GitHub read failed ('+c+'). '+(err&&err.message||'')); }

// ---------- live loading ----------
function getRef(){ const u=new URL(location.href).searchParams.get('ref'); if(u) return u; try{ return localStorage.getItem('brain.ref')||DEFAULT_REF; }catch(e){ return DEFAULT_REF; } }
let REF=getRef(); refEl.value=REF;
const results={}, errors={}; let unsubs=[], rebuildTimer=null, headSha=null, loadedAt=null;
function offlineGraph(){ buildGraph({}); subEl.innerHTML='Structural view only. Nothing has been read from the repository.'; }
function scheduleRebuild(){ clearTimeout(rebuildTimer); rebuildTimer=setTimeout(rebuild,180); }
function rebuild(){
  const R={}; for(const k in READS){ const r=results[k]; if(!r) continue; R[k]= READS[k].kind==='file' ? fileText(r) : {list:dirList(r)}; if(R[k].sha) headSha=R[k].sha; if(r.cache&&r.cache.storedAt) loadedAt=Math.max(loadedAt||0,r.cache.storedAt); }
  const have=Object.keys(R).length, want=Object.keys(READS).length; const keepAct={...activity}; const stats=buildGraph(R); for(const id in keepAct) if(byId[id]) activity[id]=keepAct[id];
  const failed=Object.keys(errors).filter(k=>!results[k]);
  subEl.innerHTML='<b>'+N.length+'</b> nodes, <b>'+E.length+'</b> synapses, read live from GitHub. '+stats.skills+' skills, '+stats.adrs+' decisions, '+stats.routines+' routines, '+stats.live+' live systems, '+stats.journals+' journal days, '+stats.artefacts+' artefacts.'+(failed.length?' <b>'+failed.length+' of '+want+' reads failed</b>: '+failed.map(k=>READS[k].path).join(', ')+'.':'');
  statusEl.innerHTML='<b>'+N.length+'</b> nodes \u00b7 <b>'+E.length+'</b> synapses \u00b7 live \u00b7 '+esc(REF)+(headSha?' @ '+headSha.slice(0,7):'')+' \u00b7 '+(loadedAt?'read '+new Date(loadedAt).toLocaleTimeString():'read just now')+(have<want?' \u00b7 '+have+'/'+want+' reads':'');
  const codes=[...new Set(failed.map(k=>errors[k].code))]; if(failed.length===want && codes.length===1) banner('Cannot read the repository', '<p>'+esc(explain(errors[failed[0]]))+'</p><p>Branch: <code>'+esc(REF)+'</code></p>'); else if(failed.length){ const e=errors[failed[0]]; banner('Some reads failed', '<p>'+esc(explain(e))+'</p><p>Failed: '+esc(failed.map(k=>READS[k].path).join(', '))+'</p>'); }
}
function watchAll(){
  for(const u of unsubs) u(); unsubs=[]; for(const k in READS){ delete results[k]; delete errors[k]; } headSha=null; loadedAt=null; banner(null);
  statusEl.innerHTML='Reading <b>'+esc(REF)+'</b> from GitHub\u2026'; touch('sys/GitHub','read','connecting to GitHub, branch '+REF);
  for(const k in READS){ const d=READS[k]; const input={owner:OWNER,repo:REPO,path:d.path,ref:'refs/heads/'+REF}; if(d.kind==='dir') input.fields=['name','type','path','size'];
    unsubs.push(mcp.watchTool(SERVER,TOOL,input,ev=>{ if(ev.type==='data'){ results[k]=ev.result; delete errors[k]; scheduleRebuild(); setTimeout(()=>{ touch(d.node,'read','read '+d.path+(ev.result.cache?' (cached)':'')); activity['sys/GitHub']={t:performance.now(),kind:'read'}; },200); } else { errors[k]=ev.error; if(/needs_reauth|server_not_connected|blocked_by_policy|approval_required|not_in_manifest|consent_required/.test(ev.error.code)) delete results[k]; touch(d.node,'error','failed '+d.path+': '+ev.error.code); scheduleRebuild(); } },{cache:{staleTime:60000,gcTime:3600000},refetchInterval:300000})); }
}
document.getElementById('reload').onclick=()=>{ const v=refEl.value.trim(); if(v && v!==REF){ REF=v; try{ localStorage.setItem('brain.ref',REF); }catch(e){} } if(!mcp){ offlineGraph(); return; } mcp.invalidate(SERVER,TOOL).catch(()=>{}).then(watchAll); };
refEl.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('reload').click(); });
statusEl.onclick=()=>{ if(bannerEl.hidden) banner('Connection', '<p>Branch <code>'+esc(REF)+'</code>. Press Diagnose to see what the page can reach.</p>'); };
offlineGraph(); renderFeed(); statusEl.innerHTML='Connecting to GitHub\u2026';
(async()=>{
  if(!window.claude || typeof window.claude.use!=='function'){ statusEl.innerHTML='Not inside claude.ai: nothing can be read.'; banner('Open this page in claude.ai','<p>The map reads the repository through your GitHub connector. A saved copy or another host has no connector, so only the structure shows.</p>'); return; }
  mcp=await window.claude.use('mcp');
  if(!mcp){ statusEl.innerHTML='No connector access in this view.'; banner('Connectors are not available here','<p>This view cannot run the GitHub connector, so the repository has not been read. Open the artifact in claude.ai and allow GitHub when asked.</p>'); return; }
  watchAll();
})();
</script>
