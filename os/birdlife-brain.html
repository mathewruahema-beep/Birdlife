.hud-top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;gap:16px;flex-wrap:wrap}

.ctl{position:fixed;right:20px;top:calc(50% - 60px);display:flex;flex-direction:column;gap:6px;z-index:2}
.ctl button{width:34px;height:34px;background:rgba(8,13,24,.82);border:1px solid var(--line);color:var(--fg);font-family:var(--mono);font-size:16px;cursor:pointer}

@media (max-width:720px){
  .hud-top{padding:12px 14px}
  .search input{width:130px}
  .legend{width:auto;left:12px;right:12px;bottom:12px;max-height:38vh;flex-direction:row;flex-wrap:wrap;gap:0 10px;padding:10px}

  .ctl{right:12px;top:auto;bottom:calc(38vh + 24px)}
}
@media (prefers-reduced-motion:reduce){ .pulse-hint{display:none} }

// ---------- layout ----------
const RING_R=[0,120,300,440,580];
const rings={};
for(const n of N){ (rings[n.ring]=rings[n.ring]||[]).push(n); }
// order ring 2 by layer so colours cluster; ring 3 by layer; ring 4 by layer
const order=['kernel','doctrine','os','memory','system','deep','cross','connskill','routines','decisions','live','artefacts','copy'];
for(const r in rings){ rings[r].sort((a,b)=>order.indexOf(a.layer)-order.indexOf(b.layer)); }
for(const r in rings){ const arr=rings[r], R=RING_R[r]; arr.forEach((n,i)=>{ const t=(i/arr.length)*Math.PI*2 - Math.PI/2; n.a=t; n.r=R; n.x=Math.cos(t)*R; n.y=Math.sin(t)*R; }); }
const adj={}; for(const e of E){ (adj[e.a]=adj[e.a]||new Set()).add(e.b); (adj[e.b]=adj[e.b]||new Set()).add(e.a); }

// ---------- state ----------
const off={}; let hover=null, sel=null, query='', rot=0, zoom=1, pan={x:0,y:0};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('stage'), cx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){ dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px'; }
addEventListener('resize',resize); resize();
function baseScale(){ const m=Math.min(W,H); return (m/2-70)/RING_R[4]; }
function centre(){ return {x:W/2+pan.x, y:H/2+ (W>720?0:-40)+pan.y}; }
function toScreen(n){ const s=baseScale()*zoom, c=centre(), t=n.a+rot; return {x:c.x+Math.cos(t)*n.r*s, y:c.y+Math.sin(t)*n.r*s, ang:t}; }
function visible(n){ return !off[n.layer]; }
function matches(n){ return query && (n.label.toLowerCase().includes(query)||n.id.toLowerCase().includes(query)); }
function focusSet(){ const f=sel||hover; if(!f) return null; const s=new Set([f.id]); (adj[f.id]||[]).forEach(x=>s.add(x)); return s; }

// glow sprites
const sprites={};
function sprite(c){ if(sprites[c]) return sprites[c]; const s=document.createElement('canvas'); s.width=s.height=64; const g=s.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,c); gr.addColorStop(.25,c+'aa'); gr.addColorStop(1,c+'00'); g.fillStyle=gr; g.fillRect(0,0,64,64); return sprites[c]=s; }

// pulses
const pulses=[]; function spawn(){ if(reduce) return; const alive=E.filter(e=>visible(byId[e.a])&&visible(byId[e.b])); if(!alive.length) return; const e=alive[Math.floor(Math.random()*alive.length)]; pulses.push({e,t:0,d:.6+Math.random()*.9, rev:Math.random()<.5}); }
let last=performance.now(), spawnAcc=0;

function draw(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!reduce && !hover && !sel) rot+=dt*0.035;
  spawnAcc+=dt; while(spawnAcc>0.08){ spawnAcc-=0.08; if(pulses.length<48) spawn(); }
  for(const p of pulses) p.t+=dt/p.d; for(let i=pulses.length-1;i>=0;i--) if(pulses[i].t>=1) pulses.splice(i,1);
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
  const c=centre(), s=baseScale()*zoom;
  // ground
  const vg=cx.createRadialGradient(c.x,c.y,0,c.x,c.y,Math.max(W,H)*.75); vg.addColorStop(0,'#0a1626'); vg.addColorStop(.45,'#060b16'); vg.addColorStop(1,'#03050b'); cx.fillStyle=vg; cx.fillRect(0,0,W,H);
  // rings and ticks
  cx.lineWidth=1; for(let r=1;r<=4;r++){ cx.strokeStyle='rgba(53,215,255,'+(r===2?.09:.05)+')'; cx.beginPath(); cx.arc(c.x,c.y,RING_R[r]*s,0,Math.PI*2); cx.stroke(); }
  cx.strokeStyle='rgba(53,215,255,.06)'; for(let i=0;i<72;i++){ const t=i/72*Math.PI*2+rot*.5; const r1=RING_R[4]*s+8, r2=r1+(i%6===0?14:6); cx.beginPath(); cx.moveTo(c.x+Math.cos(t)*r1,c.y+Math.sin(t)*r1); cx.lineTo(c.x+Math.cos(t)*r2,c.y+Math.sin(t)*r2); cx.stroke(); }
  const fs=focusSet();
  // edges
  for(const e of E){ const a=byId[e.a], b=byId[e.b]; if(!visible(a)||!visible(b)) continue; const A=toScreen(a), B=toScreen(b); const inF=fs && fs.has(a.id) && fs.has(b.id) && (a.id===(sel||hover).id || b.id===(sel||hover).id); let al = fs ? (inF? .85 : .04) : (e.label==='reads first'? .05 : .13); if(query && !fs){ al = (matches(a)||matches(b)) ? .5 : .03; } const col=LAYERS[(a.ring>b.ring?a:b).layer].c; cx.strokeStyle=col+Math.round(al*255).toString(16).padStart(2,'0'); cx.lineWidth= inF?1.4:.8; cx.beginPath(); const mx=(A.x+B.x)/2, my=(A.y+B.y)/2, k=.18; const qx=mx+(c.x-mx)*k, qy=my+(c.y-my)*k; cx.moveTo(A.x,A.y); cx.quadraticCurveTo(qx,qy,B.x,B.y); cx.stroke(); }
  // pulses
  for(const p of pulses){ const a=byId[p.e.a], b=byId[p.e.b]; if(!visible(a)||!visible(b)) continue; let A=toScreen(a), B=toScreen(b); if(p.rev){ const t=A; A=B; B=t; } const mx=(A.x+B.x)/2, my=(A.y+B.y)/2, k=.18, qx=mx+(c.x-mx)*k, qy=my+(c.y-my)*k; const t=p.t, u=1-t; const x=u*u*A.x+2*u*t*qx+t*t*B.x, y=u*u*A.y+2*u*t*qy+t*t*B.y; const col=LAYERS[(a.ring>b.ring?a:b).layer].c; const dim = fs && !(fs.has(a.id)&&fs.has(b.id)); cx.globalAlpha=dim?.15:.9; cx.drawImage(sprite(col),x-7,y-7,14,14); cx.globalAlpha=1; }
  // nodes + labels
  const breathe = reduce?1:(1+Math.sin(now/900)*.08);
  for(const n of N){ if(!visible(n)) continue; const P=toScreen(n); const col=LAYERS[n.layer].c; const isF = fs? fs.has(n.id) : true; const m = query? matches(n) : true; const al = (isF && (m||fs)) ? 1 : .18; const base = n.ring===0?9: n.ring===1?5.5: n.ring===2?4.2: 3.2; const rad = base*(n.id===(sel&&sel.id)||n.id===(hover&&hover.id)?1.5:1); cx.globalAlpha=al*.9; const g= rad*3.2*breathe; cx.drawImage(sprite(col),P.x-g,P.y-g,g*2,g*2); cx.globalAlpha=al; cx.fillStyle='#ffffff'; cx.beginPath(); cx.arc(P.x,P.y,rad*.55,0,Math.PI*2); cx.fill(); cx.fillStyle=col; cx.beginPath(); cx.arc(P.x,P.y,rad,0,Math.PI*2); cx.globalAlpha=al*.55; cx.fill(); cx.globalAlpha=1; }
  // labels
  const showOuter = W>560 || zoom>1.4;
  cx.textBaseline='middle';
  for(const n of N){ if(!visible(n)) continue; const P=toScreen(n); const col=LAYERS[n.layer].c; const isF = fs? fs.has(n.id) : true; const m = query? matches(n) : true; const hot = n.id===(sel&&sel.id)||n.id===(hover&&hover.id);
    if(n.ring===0){ cx.font='500 12px '+getComputedStyle(document.body).getPropertyValue('--mono'); cx.textAlign='center'; cx.fillStyle=col; cx.globalAlpha=isF?1:.3; cx.fillText(n.label,P.x,P.y+22); cx.globalAlpha=1; continue; }
    if(n.ring===1){ cx.font='11px '+getComputedStyle(document.body).getPropertyValue('--mono'); const dx=Math.cos(P.ang), left=dx<0; cx.textAlign=left?'right':'left'; cx.fillStyle=hot?'#ffffff':col; cx.globalAlpha=(isF&&(m||fs))?.95:.2; cx.fillText(n.label,P.x+(left?-10:10),P.y); cx.globalAlpha=1; continue; }
    if(!showOuter && !hot) continue;
    cx.save(); cx.translate(P.x,P.y); let ang=P.ang; const flip = Math.cos(ang)<0; cx.rotate(flip?ang+Math.PI:ang); cx.font=(hot?'500 11.5px ':'10px ')+getComputedStyle(document.body).getPropertyValue('--mono'); cx.textAlign=flip?'right':'left'; cx.fillStyle=hot?'#ffffff':col; cx.globalAlpha=(isF&&(m||fs))?(n.ring===2?.9:.7):.12; cx.fillText(n.label,flip?-11:11,0); cx.restore(); cx.globalAlpha=1; }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---------- interaction ----------
function pick(x,y){ let best=null,bd=14*14; for(const n of N){ if(!visible(n)) continue; const P=toScreen(n); const d=(P.x-x)**2+(P.y-y)**2; if(d<bd){bd=d;best=n;} } return best; }
const tip=document.getElementById('tip');
let drag=null, moved=false;
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y}; moved=false; cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing'); });
cv.addEventListener('pointermove',e=>{ if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; if(moved){ pan.x=drag.px+dx; pan.y=drag.py+dy; } return; } const n=pick(e.clientX,e.clientY); hover=n; if(n){ tip.style.display='block'; tip.style.setProperty('--c',LAYERS[n.layer].c); tip.innerHTML='<span class="k">'+LAYERS[n.layer].name+'</span><span class="n">'+esc(n.label)+'</span>'; tip.style.left=Math.min(e.clientX+14,W-270)+'px'; tip.style.top=Math.max(8,e.clientY-10)+'px'; cv.style.cursor='pointer'; } else { tip.style.display='none'; cv.style.cursor='grab'; } });
cv.addEventListener('pointerup',e=>{ cv.classList.remove('grabbing'); if(drag && !moved){ const n=pick(e.clientX,e.clientY); select(n); } drag=null; });
cv.addEventListener('pointerleave',()=>{ hover=null; tip.style.display='none'; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoom=Math.max(.6,Math.min(3,zoom*(e.deltaY<0?1.1:.9))); },{passive:false});
document.getElementById('zin').onclick=()=>zoom=Math.min(3,zoom*1.2);
document.getElementById('zout').onclick=()=>zoom=Math.max(.6,zoom/1.2);
document.getElementById('zfit').onclick=()=>{zoom=1;pan={x:0,y:0};};
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const insp=document.getElementById('insp'), ib=document.getElementById('ib');
function select(n){ sel=n; if(!n){ insp.classList.remove('open'); return; } const L=LAYERS[n.layer]; insp.style.setProperty('--c',L.c); const nb=[...(adj[n.id]||[])].map(id=>byId[id]).filter(Boolean); nb.sort((a,b)=>order.indexOf(a.layer)-order.indexOf(b.layer)); ib.innerHTML='<div class="kind">'+esc(L.name)+'</div><h3>'+esc(n.label)+'</h3><p>'+esc(n.desc)+'</p><div class="path">'+esc(n.path)+'</div>'+(nb.length?'<div class="kind" style="margin-bottom:6px">Connected ('+nb.length+')</div><div class="links">'+nb.map(m=>'<button data-id="'+esc(m.id)+'" style="--c:'+LAYERS[m.layer].c+'"><i></i>'+esc(m.label)+'</button>').join('')+'</div>':''); insp.classList.add('open'); ib.querySelectorAll('button').forEach(b=>b.onclick=()=>select(byId[b.dataset.id])); }
document.getElementById('ic').onclick=()=>select(null);
addEventListener('keydown',e=>{ if(e.key==='Escape') select(null); });

// legend
const legend=document.getElementById('legend'); const counts={}; for(const n of N) counts[n.layer]=(counts[n.layer]||0)+1;
legend.innerHTML='<h2>Layers · click to isolate</h2>'+order.map(k=>'<button class="lg" data-k="'+k+'" style="--c:'+LAYERS[k].c+'" title="'+esc(LAYERS[k].what)+'"><i></i><span>'+esc(LAYERS[k].name)+'</span><em>'+counts[k]+'</em></button>').join('')+'<div class="foot">Drag to pan, wheel to zoom, click a node for detail. Pulses are synapses: knowledge moving between layers.</div>';
legend.querySelectorAll('.lg').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; const anyOff=Object.values(off).some(v=>v); const onlyThis = !off[k] && Object.keys(LAYERS).filter(x=>x!==k).every(x=>off[x]); if(onlyThis){ for(const x in LAYERS) off[x]=false; } else if(!anyOff){ for(const x in LAYERS) off[x]=x!==k; } else { off[k]=!off[k]; } legend.querySelectorAll('.lg').forEach(x=>x.classList.toggle('off',!!off[x.dataset.k])); if(sel && off[sel.layer]) select(null); });
// search
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); });
// header
document.getElementById('sub').innerHTML='<b>'+N.length+'</b> nodes, <b>'+E.length+'</b> synapses. '+DATA.skills.length+' skills, '+DATA.adrs.length+' decisions, '+ROUT.length+' routines, '+LIVE.length+' live systems. The repository is the brain; everything here is a file in it or a system it reaches.';
document.getElementById('status').innerHTML='<b>'+N.length+'</b> nodes · <b>'+E.length+'</b> synapses · as at 12 Sep 2026 · commit 8036c72';
</script>
