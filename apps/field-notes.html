<title>Mathew Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Exo+2:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
  :root {
    --bg: #E8EDF2;
    --panel: #FFFFFF;
    --panel-2: #F1F5F9;
    --ink: #16202B;
    --muted: #5C7085;
    --line: #C6D3DF;
    --line-dim: #DAE3EC;
    --accent: #0E8BE8;
    --accent-bright: #3FB1FF;
    --accent-soft: #E1F0FC;
    --on-accent: #FFFFFF;
    --rec: #D93B33;
    --rec-soft: #FBE3E1;
    --glow: 0 0 14px rgba(30, 143, 232, 0.4);
    --glow-strong: 0 0 26px rgba(30, 143, 232, 0.5);
    --shadow: 0 10px 30px rgba(22, 32, 43, 0.12);
    --display: "Michroma", "Arial Black", sans-serif;
    --sans: "Exo 2", "Segoe UI", system-ui, sans-serif;
    --mono: "Share Tech Mono", "SF Mono", "Consolas", monospace;
  }

  * { box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse 100% 45% at 50% -8%, rgba(255, 255, 255, 0.9), transparent 60%),
      radial-gradient(ellipse 80% 35% at 50% 108%, rgba(63, 177, 255, 0.10), transparent 65%),
      linear-gradient(180deg, #F2F6FA 0%, #E8EDF2 45%, #DFE6ED 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input, textarea, select { font: inherit; color: var(--ink); }
  input::placeholder, textarea::placeholder { color: var(--muted); }

  #app { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; position: relative; z-index: 1; }

  header.appbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 10px;
  }
  .wordmark {
    font-family: var(--display); font-weight: 400; font-size: 13px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink);
  }
  .wordmark .dot { color: var(--accent); }
  #storageBadge {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
    background: linear-gradient(180deg, #FFFFFF, #F1F5F9);
    box-shadow: 0 2px 6px rgba(22, 32, 43, 0.08);
  }

  main { flex: 1; padding: 0 16px 100px; }
  section.view[hidden] { display: none !important; }

  /* ---------- Notes list ---------- */
  .searchwrap { position: relative; margin: 6px 0 14px; }
  .searchwrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--accent); }
  #search {
    width: 100%; border: 1px solid var(--line-dim); background: var(--panel);
    border-radius: 999px; padding: 11px 14px 11px 40px; font-size: 16px; font-weight: 500;
    box-shadow: inset 0 1px 3px rgba(22, 32, 43, 0.05);
  }
  #search:focus { border-color: var(--accent-bright); }

  .notecard {
    width: 100%; text-align: left; background: linear-gradient(180deg, #FFFFFF, #FAFCFE);
    border: 1px solid var(--line-dim); border-left: 3px solid var(--accent);
    border-radius: 16px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px;
    box-shadow: 0 3px 10px rgba(22, 32, 43, 0.07);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .notecard:active { background: var(--panel-2); box-shadow: 0 1px 4px rgba(22, 32, 43, 0.08); }
  .notecard .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .notecard h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
  .notecard .when { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; letter-spacing: 0.06em; }
  .notecard .snippet { color: var(--muted); font-size: 15px; margin: 0; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; padding: 3px 11px; border-radius: 999px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
    background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(14, 139, 232, 0.22);
  }
  .chip.meta { background: var(--panel-2); color: var(--muted); font-family: var(--mono); font-weight: 400; border-color: var(--line-dim); }
  .chip.example { background: var(--rec-soft); color: var(--rec); border-color: rgba(217, 59, 51, 0.25); }

  .emptynote { text-align: center; color: var(--muted); padding: 28px 20px 8px; font-size: 15px; font-weight: 500; }
  .emptynote strong { color: var(--accent); letter-spacing: 0.08em; }
  .newtyped { display: block; margin: 6px auto 0; color: var(--accent); font-weight: 700; padding: 8px; letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; }

  /* ---------- Record ---------- */
  #view-record { display: flex; flex-direction: column; align-items: center; }
  .rec-top { width: 100%; display: flex; justify-content: flex-end; padding: 4px 0 8px; }
  #lang {
    border: 1px solid var(--line-dim); background: var(--panel); border-radius: 999px; padding: 6px 14px;
    font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0.05em;
    box-shadow: 0 2px 6px rgba(22, 32, 43, 0.06);
  }
  #lang option { background: #FFFFFF; color: var(--ink); }

  #micring { position: relative; margin-top: 30px; width: 152px; height: 152px; display: grid; place-items: center; }
  #micring::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(14, 139, 232, 0.4);
    -webkit-mask: conic-gradient(#000 0 70deg, transparent 70deg 90deg, #000 90deg 250deg, transparent 250deg 270deg, #000 270deg);
    mask: conic-gradient(#000 0 70deg, transparent 70deg 90deg, #000 90deg 250deg, transparent 250deg 270deg, #000 270deg);
    animation: spin 14s linear infinite;
  }
  #micring::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    border: 1px dashed var(--line);
    animation: spin 22s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bigmic {
    width: 104px; height: 104px; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%, #FFFFFF 0%, rgba(255, 255, 255, 0) 42%),
      radial-gradient(circle at 50% 60%, rgba(63, 177, 255, 0.28), rgba(63, 177, 255, 0) 62%),
      linear-gradient(180deg, #FDFEFF 0%, #E8EEF4 55%, #D4DEE7 100%);
    border: 2px solid rgba(14, 139, 232, 0.55);
    color: var(--accent);
    display: grid; place-items: center;
    box-shadow: var(--glow-strong), 0 12px 26px rgba(22, 32, 43, 0.18), inset 0 -8px 16px rgba(22, 32, 43, 0.08);
    transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    position: relative; z-index: 1;
  }
  #bigmic:active { transform: scale(0.94); }
  #bigmic.recording {
    border-color: var(--rec); color: var(--rec);
    background:
      radial-gradient(circle at 34% 28%, #FFFFFF 0%, rgba(255, 255, 255, 0) 42%),
      radial-gradient(circle at 50% 60%, rgba(217, 59, 51, 0.3), rgba(217, 59, 51, 0) 62%),
      linear-gradient(180deg, #FDFEFF 0%, #EEE7E6 55%, #E2D6D4 100%);
    box-shadow: 0 0 26px rgba(217, 59, 51, 0.5), 0 12px 26px rgba(22, 32, 43, 0.18), inset 0 -8px 16px rgba(22, 32, 43, 0.08);
    animation: pulse 1.5s ease-in-out infinite;
  }
  #micring.recording::before { border-color: rgba(217, 59, 51, 0.5); }
  #micring.recording::after { border-color: rgba(217, 59, 51, 0.35); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 26px rgba(217, 59, 51, 0.5), 0 12px 26px rgba(22, 32, 43, 0.18), inset 0 -8px 16px rgba(22, 32, 43, 0.08); }
    50% { box-shadow: 0 0 46px rgba(217, 59, 51, 0.75), 0 12px 26px rgba(22, 32, 43, 0.18), inset 0 -8px 16px rgba(22, 32, 43, 0.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    #bigmic.recording, #micring::before, #micring::after { animation: none; }
  }
  #timer {
    font-family: var(--mono); font-size: 26px; margin-top: 18px; color: var(--accent);
    text-shadow: 0 0 10px rgba(30, 143, 232, 0.35); font-variant-numeric: tabular-nums; letter-spacing: 0.08em;
  }
  #recHint { color: var(--muted); font-size: 15px; font-weight: 500; margin-top: 6px; text-align: center; max-width: 440px; }
  #btnDim {
    margin-top: 14px; padding: 8px 20px; color: var(--muted); font-weight: 700; font-size: 13px;
    letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid var(--line);
    border-radius: 999px; background: var(--panel);
    box-shadow: 0 2px 6px rgba(22, 32, 43, 0.06);
  }
  #btnDim[hidden] { display: none !important; }
  #live {
    width: 100%; min-height: 120px; max-height: 36dvh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line-dim); border-radius: 16px;
    padding: 14px 16px; margin-top: 22px; font-size: 16px; font-weight: 500; color: var(--ink);
    white-space: pre-wrap;
    box-shadow: inset 0 1px 3px rgba(22, 32, 43, 0.05);
  }
  #live:empty::before { content: "› Awaiting audio input…"; color: var(--muted); font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; }

  /* ---------- Dim (stealth recording) overlay ---------- */
  #dimmer {
    position: fixed; inset: 0; background: #000; z-index: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  #dimmer[hidden] { display: none !important; }
  #dimmer .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--rec);
    box-shadow: 0 0 14px rgba(217, 59, 51, 0.8);
    animation: dimpulse 1.8s ease-in-out infinite;
  }
  @keyframes dimpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { #dimmer .dot { animation: none; } }
  #dimTimer { font-family: var(--mono); font-size: 15px; color: rgba(217, 59, 51, 0.65); letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }
  #dimmer .hint { color: rgba(255, 255, 255, 0.22); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }

  /* ---------- Review ---------- */
  #review { width: 100%; display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
  #review[hidden] { display: none !important; }
  #rvTitle {
    width: 100%; border: 1px solid var(--line-dim); background: var(--panel); border-radius: 14px;
    padding: 11px 14px; font-size: 19px; font-weight: 700;
  }
  #rvTranscript {
    width: 100%; min-height: 140px; border: 1px solid var(--line-dim); background: var(--panel); border-radius: 14px;
    padding: 12px 14px; font-size: 16px; font-weight: 500; line-height: 1.5; resize: vertical;
  }
  #rvTitle:focus, #rvTranscript:focus { border-color: var(--accent-bright); }
  .aiblock {
    background: linear-gradient(180deg, #FFFFFF, #FAFCFE);
    border: 1px solid var(--line-dim); border-left: 3px solid var(--accent);
    border-radius: 16px; padding: 14px 16px;
    box-shadow: 0 3px 10px rgba(22, 32, 43, 0.07);
  }
  .aiblock h4 { margin: 12px 0 4px; font-family: var(--display); font-size: 9px; letter-spacing: 0.22em; color: var(--accent); font-weight: 400; text-transform: uppercase; }
  .aiblock h4:first-child { margin-top: 0; }
  .aiblock p { margin: 0; font-size: 15px; font-weight: 500; }
  .aiblock ul { margin: 4px 0 0; padding-left: 20px; font-size: 15px; font-weight: 500; }
  .btnrow { display: flex; gap: 10px; }
  .btn {
    flex: 1; text-align: center; padding: 13px 16px; border-radius: 999px; font-weight: 700; font-size: 14px;
    letter-spacing: 0.14em; text-transform: uppercase;
    border: 1px solid var(--line); background: var(--panel); color: var(--accent);
    box-shadow: 0 2px 6px rgba(22, 32, 43, 0.06);
  }
  .btn.primary {
    background: linear-gradient(180deg, var(--accent-bright), var(--accent));
    color: var(--on-accent); border-color: var(--accent); box-shadow: var(--glow), 0 4px 12px rgba(22, 32, 43, 0.15);
  }
  .btn.quiet { color: var(--muted); background: transparent; border-color: var(--line-dim); box-shadow: none; }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .ainote { font-size: 14px; color: var(--rec); font-weight: 600; }

  /* ---------- Ask ---------- */
  #chatlog { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 12px; }
  .bubble { max-width: 88%; padding: 10px 15px; font-size: 16px; font-weight: 500; white-space: pre-wrap; overflow-wrap: break-word; border-radius: 18px; }
  .bubble.user {
    align-self: flex-end; color: var(--on-accent); font-weight: 600;
    background: linear-gradient(180deg, var(--accent-bright), var(--accent));
    border-bottom-right-radius: 6px; box-shadow: 0 3px 10px rgba(14, 139, 232, 0.3);
  }
  .bubble.ai {
    align-self: flex-start; background: var(--panel); border: 1px solid var(--line-dim);
    border-bottom-left-radius: 6px; box-shadow: 0 3px 10px rgba(22, 32, 43, 0.07);
  }
  .askbar { display: flex; gap: 8px; }
  #askInput {
    flex: 1; border: 1px solid var(--line-dim); background: var(--panel); border-radius: 999px;
    padding: 12px 16px; font-size: 16px; font-weight: 500;
    box-shadow: inset 0 1px 3px rgba(22, 32, 43, 0.05);
  }
  #askInput:focus { border-color: var(--accent-bright); }
  #askSend, #askStop {
    width: 48px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(180deg, var(--accent-bright), var(--accent));
    color: var(--on-accent); box-shadow: var(--glow);
  }
  #askStop { background: linear-gradient(180deg, #E86A5F, var(--rec)); box-shadow: 0 0 12px rgba(217, 59, 51, 0.4); }
  .askempty { color: var(--muted); font-size: 15px; font-weight: 500; text-align: center; padding: 30px 20px; }

  /* ---------- Bottom nav ---------- */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
    display: flex; justify-content: center;
    background: rgba(255, 255, 255, 0.88); border-top: 1px solid var(--line-dim);
    backdrop-filter: blur(10px);
    box-shadow: 0 -4px 18px rgba(22, 32, 43, 0.08);
    padding: 6px 0 max(10px, env(safe-area-inset-bottom));
  }
  nav.tabs .inner { display: flex; width: 100%; max-width: 640px; }
  nav.tabs button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 7px 0; position: relative;
  }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs button.active::before {
    content: ""; position: absolute; top: -7px; left: 30%; right: 30%;
    height: 3px; border-radius: 999px; background: var(--accent); box-shadow: var(--glow);
  }

  /* ---------- Detail sheet ---------- */
  #sheet {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(180deg, #F2F6FA 0%, #E8EDF2 45%, #DFE6ED 100%);
    overflow-y: auto; padding: 0 16px 40px;
  }
  #sheet[hidden] { display: none !important; }
  .sheetbar {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 6px;
    position: sticky; top: 0; background: rgba(242, 246, 250, 0.95); z-index: 2;
  }
  .sheetbar button { color: var(--accent); font-weight: 700; padding: 6px 8px; letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px; }
  .sheetbar #dDelete { color: var(--rec); }
  #sheet h2 {
    margin: 8px 4px 4px; font-family: var(--display); font-size: 17px; font-weight: 400;
    letter-spacing: 0.06em; text-wrap: balance; line-height: 1.4;
  }
  #dMeta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 0 4px 16px; letter-spacing: 0.08em; }
  .dsec {
    background: linear-gradient(180deg, #FFFFFF, #FAFCFE);
    border: 1px solid var(--line-dim); border-left: 3px solid var(--accent);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 3px 10px rgba(22, 32, 43, 0.07);
  }
  .dsec h4 { margin: 0 0 8px; font-family: var(--display); font-size: 9px; letter-spacing: 0.22em; color: var(--accent); font-weight: 400; text-transform: uppercase; }
  .dsec p { margin: 0; font-size: 16px; font-weight: 500; }
  .action { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 16px; font-weight: 500; }
  .action input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
  .action.done label { color: var(--muted); text-decoration: line-through; }
  details.transcript summary {
    cursor: pointer; font-family: var(--display); font-size: 9px; letter-spacing: 0.22em;
    color: var(--accent); font-weight: 400; text-transform: uppercase;
  }
  details.transcript div { margin-top: 10px; font-size: 16px; font-weight: 500; white-space: pre-wrap; }

  /* ---------- Actions hub ---------- */
  .ahub-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 14px; }
  .ahub-head h3 { margin: 0; font-family: var(--display); font-size: 11px; letter-spacing: 0.2em; color: var(--accent); font-weight: 400; text-transform: uppercase; }
  .copybtn {
    padding: 8px 16px; color: var(--accent); font-weight: 700; font-size: 12px;
    letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid var(--line);
    border-radius: 999px; background: var(--panel); white-space: nowrap;
    box-shadow: 0 2px 6px rgba(22, 32, 43, 0.06);
  }
  .agroup { margin-bottom: 14px; }
  .agroup .gtitle {
    font-weight: 700; font-size: 15px; letter-spacing: 0.02em; margin: 0 2px 6px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  }
  .agroup .gtitle .when { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
  .agroup .gtitle button { color: inherit; font-weight: 700; text-align: left; }
  .ameta { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

  #toast {
    position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
    background: var(--panel); color: var(--accent); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 22px; font-size: 14px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    z-index: 100; box-shadow: var(--glow), 0 6px 18px rgba(22, 32, 43, 0.15); white-space: nowrap;
  }
  #toast[hidden] { display: none !important; }
</style>

<div id="app">
  <header class="appbar">
    <div class="wordmark">Mathew<span class="dot"> Notes</span></div>
    <span id="storageBadge">boot…</span>
  </header>

  <main>
    <!-- NOTES -->
    <section class="view" id="view-notes" hidden>
      <div class="searchwrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search notes, tags, transcripts" autocomplete="off">
      </div>
      <div id="notelist"></div>
    </section>

    <!-- RECORD -->
    <section class="view" id="view-record">
      <div id="capture">
        <div class="rec-top">
          <select id="lang" aria-label="Transcription language">
            <option value="en-AU">English (AU)</option>
            <option value="en-GB">English (UK)</option>
            <option value="en-US">English (US)</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;">
          <div id="micring">
            <button id="bigmic" aria-label="Start recording">
              <svg id="micIcon" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
              <svg id="stopIcon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            </button>
          </div>
          <div id="timer">00:00</div>
          <p id="recHint">Tap to capture a conversation or a thought. Audio is transcribed live, on-device.</p>
          <button id="btnDim" hidden>◐ Dim screen</button>
          <div id="live" style="width:100%"></div>
        </div>
      </div>

      <div id="review" hidden>
        <input id="rvTitle" placeholder="Untitled note">
        <textarea id="rvTranscript" placeholder="Transcript (you can edit or type here)"></textarea>
        <div class="aiblock" id="aiPreview" hidden>
          <div id="aiOut"></div>
        </div>
        <p class="ainote" id="aiMsg" hidden></p>
        <div class="btnrow">
          <button class="btn" id="btnAI">✦ AI Analysis</button>
          <button class="btn primary" id="btnSave">Save</button>
        </div>
        <div class="btnrow">
          <button class="btn quiet" id="btnDiscard">Discard</button>
        </div>
      </div>
    </section>

    <!-- ACTIONS -->
    <section class="view" id="view-actions" hidden>
      <div id="actionhub"></div>
    </section>

    <!-- ASK -->
    <section class="view" id="view-ask" hidden>
      <div id="chatlog"></div>
      <p class="askempty" id="askEmpty">Query your saved notes.<br>"What did I agree to yesterday?" · "List all my open action items."</p>
      <div class="askbar">
        <input id="askInput" placeholder="Ask your notes…" autocomplete="off">
        <button id="askSend" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-4 14-3.5-5.5L5 12Z"/></svg></button>
        <button id="askStop" aria-label="Stop" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <div class="inner">
      <button data-tab="notes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Notes</button>
      <button data-tab="record" class="active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>Record</button>
      <button data-tab="actions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5 11 13.5 15 9.5"/><rect x="4" y="4" width="16" height="16" rx="2"/></svg>Actions</button>
      <button data-tab="ask"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5Z"/><path d="M9 11h6M9 14h3"/></svg>Ask</button>
    </div>
  </nav>
</div>

<!-- NOTE DETAIL -->
<div id="sheet" hidden>
  <div class="sheetbar">
    <button id="dBack">‹ Back</button>
    <div style="display:flex;gap:4px">
      <button id="dCopy">Copy</button>
      <button id="dDelete">Delete</button>
    </div>
  </div>
  <h2 id="dTitle"></h2>
  <p id="dMeta"></p>
  <div id="dBody"></div>
</div>

<div id="toast" hidden></div>

<!-- STEALTH DIM OVERLAY -->
<div id="dimmer" hidden>
  <div class="dot"></div>
  <div id="dimTimer">00:00</div>
  <div class="hint">Recording · tap to wake</div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- state ----------
  let notes = [];
  let sampleFn = null;      // claude sample capability, or null
  let dbRef = null;         // claude db capability, or null
  let storageMode = "loading";
  let currentTab = "record";
  let openNoteId = null;

  const LS_KEY = "fieldnotes.v1";
  const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } };
  const lsSet = (v) => { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch {} };

  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "n" + Date.now() + Math.random().toString(36).slice(2, 8));
  const fmtDate = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  };
  const fmtDur = (s) => { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60); return `${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

  let toastTimer = null;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  function copyFor(code) {
    switch (code) {
      case "rate_limited": return "Claude is busy or you've hit a usage limit. Try again shortly.";
      case "refused": return "Claude declined this request. Rephrase and try again.";
      case "invalid_json": return "Couldn't read the AI response. Try again.";
      case "session_expired": return "Your Claude session expired. Sign in again and retry.";
      case "upstream_error": return "Connection hiccup. Try again.";
      case "prompt_too_large": return "Too much text for one request. Trim the transcript and retry.";
      case "cancelled": return "";
      default: return "AI isn't available right now.";
    }
  }
  const AI_GONE = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);

  // ---------- storage ----------
  function updateBadge() {
    $("storageBadge").textContent =
      storageMode === "cloud" ? "sync · cloud" :
      storageMode === "local" ? "sync · local" : "boot…";
  }

  async function initStorage() {
    // show local notes immediately; upgrade to cloud when the capability resolves
    notes = lsGet(); renderNotes();
    let db = null;
    try { db = window.claude?.use ? await claude.use("db") : null; } catch { db = null; }
    if (db) {
      dbRef = db; storageMode = "cloud";
      db.collection("notes").orderBy("createdAt", "desc").limit(500).onSnapshot(
        (snap) => { notes = snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() })); renderNotes(); if (openNoteId) renderSheet(); },
        () => { storageMode = "local"; dbRef = null; notes = lsGet(); renderNotes(); updateBadge(); }
      );
    } else {
      storageMode = "local";
    }
    updateBadge();
  }

  async function saveNote(note) {
    if (dbRef) {
      try { await dbRef.collection("notes").doc(note.id).set(note); return true; }
      catch (e) { toast(e && e.code === "quota_exceeded" ? "Note limit reached. Delete old notes first." : "Couldn't save. Try again."); return false; }
    }
    notes = [note, ...notes.filter((n) => n.id !== note.id)];
    lsSet(notes); renderNotes(); return true;
  }
  async function patchNote(id, patch) {
    const i = notes.findIndex((n) => n.id === id);
    if (i >= 0) { notes[i] = { ...notes[i], ...patch }; renderNotes(); if (openNoteId === id) renderSheet(); }
    if (dbRef) { try { await dbRef.collection("notes").doc(id).update(patch); } catch {} }
    else lsSet(notes);
  }
  async function deleteNote(id) {
    notes = notes.filter((n) => n.id !== id);
    renderNotes();
    if (dbRef) { try { await dbRef.collection("notes").doc(id).delete(); } catch {} }
    else lsSet(notes);
  }

  // ---------- tabs ----------
  document.querySelectorAll("nav.tabs button").forEach((b) => {
    b.addEventListener("click", () => setTab(b.dataset.tab));
  });
  function setTab(tab) {
    currentTab = tab;
    ["notes", "record", "actions", "ask"].forEach((t) => {
      $("view-" + t).hidden = t !== tab;
      document.querySelector(`nav.tabs button[data-tab="${t}"]`).classList.toggle("active", t === tab);
    });
  }

  // ---------- notes list ----------
  const EXAMPLE = {
    id: "__example__", example: true,
    title: "Team stand-up debrief",
    createdAt: new Date().toISOString(), durationSec: 154, source: "voice",
    summary: "This is an example so you can see how a saved note looks. Record your first note and this card disappears.",
    transcript: "Quick sync on the helpdesk queue. Two cases need vendor follow-up before Friday, and the licence renewal quote is still outstanding.",
    actions: [{ text: "Chase vendor on the two open cases", done: false }, { text: "Get the licence renewal quote", done: true }],
    tags: ["example"],
  };

  function visibleNotes() {
    const q = $("search").value.trim().toLowerCase();
    let list = notes;
    if (!q) return list;
    return list.filter((n) =>
      [n.title, n.summary, n.transcript, (n.tags || []).join(" ")].join(" ").toLowerCase().includes(q)
    );
  }

  function renderNotes() {
    const wrap = $("notelist");
    const list = visibleNotes();
    const showExample = notes.length === 0 && !$("search").value.trim();
    let html = "";
    if (showExample) {
      html += `<p class="emptynote">No entries logged. Hit <strong>RECORD</strong> and just talk — you'll get a transcript, a summary and action items.</p>`;
      html += noteCardHTML(EXAMPLE);
    } else if (list.length === 0) {
      html += `<p class="emptynote">Nothing matches that search.</p>`;
    } else {
      html += list.map(noteCardHTML).join("");
    }
    html += `<button class="newtyped" id="btnTyped">+ New typed note</button>`;
    wrap.innerHTML = html;
    wrap.querySelectorAll(".notecard").forEach((el) => el.addEventListener("click", () => openSheet(el.dataset.id)));
    $("btnTyped").addEventListener("click", () => { startReview("", 0, "typed"); setTab("record"); });
    renderActions();
  }

  function noteCardHTML(n) {
    const tags = (n.tags || []).slice(0, 4).map((t) => `<span class="chip${t === "example" ? " example" : ""}">${esc(t)}</span>`).join("");
    const dur = n.durationSec ? `<span class="chip meta">${fmtDur(n.durationSec)}</span>` : "";
    return `<button class="notecard" data-id="${esc(n.id)}">
      <div class="row1"><h3>${esc(n.title || "Untitled note")}</h3><span class="when">${esc(fmtDate(n.createdAt))}</span></div>
      <p class="snippet">${esc(n.summary || n.transcript || "")}</p>
      <div class="chips">${dur}${tags}</div>
    </button>`;
  }

  $("search").addEventListener("input", renderNotes);

  // ---------- actions hub ----------
  function renderActions() {
    const hub = $("actionhub");
    if (!hub) return;
    const groups = notes
      .map((n) => ({ note: n, open: (n.actions || []).filter((a) => !a.done), doneCount: (n.actions || []).filter((a) => a.done).length }))
      .filter((g) => g.open.length || g.doneCount);
    const openTotal = groups.reduce((s, g) => s + g.open.length, 0);
    if (!groups.length) {
      hub.innerHTML = `<p class="emptynote">No action items yet. Run <strong>AI ANALYSIS</strong> on a note and every action lands here.</p>`;
      return;
    }
    let html = `<div class="ahub-head"><h3>${openTotal} open action${openTotal === 1 ? "" : "s"}</h3><button class="copybtn" id="btnCopyPlan">Copy plan</button></div>`;
    for (const g of groups) {
      html += `<div class="agroup"><div class="gtitle"><button data-open="${esc(g.note.id)}">${esc(g.note.title || "Untitled note")}</button><span class="when">${esc(fmtDate(g.note.createdAt))}</span></div>`;
      html += `<div class="dsec">`;
      if (g.open.length) {
        html += g.open.map((a) => {
          const idx = g.note.actions.indexOf(a);
          return `<div class="action"><input type="checkbox" data-note="${esc(g.note.id)}" data-i="${idx}"><label>${esc(actionLabel(a))}</label></div>`;
        }).join("");
      }
      if (g.doneCount) html += `<div class="ameta">${g.doneCount} completed</div>`;
      html += `</div></div>`;
    }
    hub.innerHTML = html;
    hub.querySelectorAll(".gtitle button").forEach((b) => b.addEventListener("click", () => openSheet(b.dataset.open)));
    hub.querySelectorAll(".action input").forEach((cb) => {
      cb.addEventListener("change", () => {
        const n = notes.find((x) => x.id === cb.dataset.note);
        if (!n) return;
        const i = Number(cb.dataset.i);
        const actions = n.actions.map((a, j) => (j === i ? { ...a, done: cb.checked } : a));
        patchNote(n.id, { actions });
      });
    });
    const cp = $("btnCopyPlan");
    if (cp) cp.addEventListener("click", () => {
      const md = `# Action plan — ${new Date().toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}\n` +
        groups.filter((g) => g.open.length).map((g) =>
          `\n## ${g.note.title || "Untitled note"} (${fmtDate(g.note.createdAt)})\n` +
          g.open.map((a) => `- [ ] ${actionLabel(a)}`).join("\n")
        ).join("\n") + "\n";
      copyText(md, "Action plan copied");
    });
  }

  // ---------- detail sheet ----------
  function findNote(id) { return id === "__example__" ? EXAMPLE : notes.find((n) => n.id === id); }
  function openSheet(id) { openNoteId = id; renderSheet(); $("sheet").hidden = false; window.scrollTo(0, 0); }
  function closeSheet() { openNoteId = null; $("sheet").hidden = true; }
  $("dBack").addEventListener("click", closeSheet);
  $("dCopy").addEventListener("click", () => {
    const n = findNote(openNoteId);
    if (n) copyText(noteMarkdown(n), "Note copied as minutes");
  });
  $("dDelete").addEventListener("click", async () => {
    const n = findNote(openNoteId);
    if (!n || n.example) { closeSheet(); return; }
    if (!confirm("Delete this note? This can't be undone.")) return;
    await deleteNote(n.id); closeSheet(); toast("Note deleted");
  });

  function renderSheet() {
    const n = findNote(openNoteId);
    if (!n) { closeSheet(); return; }
    $("dDelete").hidden = !!n.example;
    $("dTitle").textContent = n.title || "Untitled note";
    $("dMeta").textContent = `${fmtDate(n.createdAt)}${n.durationSec ? " · " + fmtDur(n.durationSec) : ""}${n.example ? " · example" : ""}`;
    const ul = (arr) => `<ul style="margin:0;padding-left:20px;font-size:16px;font-weight:500">${arr.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`;
    let html = "";
    if (n.summary) html += `<div class="dsec"><h4>Summary</h4><p>${esc(n.summary)}</p></div>`;
    if (n.outline && n.outline.length) html += `<div class="dsec"><h4>Full notes</h4>${ul(n.outline)}</div>`;
    if (n.keyPoints && n.keyPoints.length) html += `<div class="dsec"><h4>Key points</h4>${ul(n.keyPoints)}</div>`;
    if (n.decisions && n.decisions.length) html += `<div class="dsec"><h4>Decisions</h4>${ul(n.decisions)}</div>`;
    if (n.actions && n.actions.length) {
      html += `<div class="dsec"><h4>Action items</h4>` + n.actions.map((a, i) =>
        `<div class="action${a.done ? " done" : ""}"><input type="checkbox" id="act${i}" data-i="${i}" ${a.done ? "checked" : ""} ${n.example ? "disabled" : ""}><label for="act${i}">${esc(actionLabel(a))}</label></div>`
      ).join("") + `</div>`;
    }
    if (n.openQuestions && n.openQuestions.length) html += `<div class="dsec"><h4>Open questions</h4>${ul(n.openQuestions)}</div>`;
    if (n.risks && n.risks.length) html += `<div class="dsec"><h4>Risks &amp; blockers</h4>${ul(n.risks)}</div>`;
    if (n.quotes && n.quotes.length) html += `<div class="dsec"><h4>On record</h4>${ul(n.quotes)}</div>`;
    if (n.tangents && n.tangents.length) html += `<div class="dsec"><h4>Off topic / parked</h4>${ul(n.tangents)}</div>`;
    if (n.tags && n.tags.length) html += `<div class="chips" style="margin:2px 4px 14px">${n.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>`;
    if (n.transcript) html += `<div class="dsec"><details class="transcript" ${n.summary ? "" : "open"}><summary>Transcript</summary><div>${esc(n.transcript)}</div></details></div>`;
    $("dBody").innerHTML = html;
    $("dBody").querySelectorAll(".action input").forEach((cb) => {
      cb.addEventListener("change", () => {
        const i = Number(cb.dataset.i);
        const actions = n.actions.map((a, j) => (j === i ? { ...a, done: cb.checked } : a));
        patchNote(n.id, { actions });
      });
    });
  }

  // ---------- recording ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let rec = null, recording = false, finalText = "", recStart = 0, timerIv = null;

  const HINT_READY = "Tap to capture a conversation or a thought. Audio is transcribed live, on-device.";
  const HINT_NO_SR = "Live transcription isn't supported in this browser. Tap the button, then use your keyboard's dictation key, or type the note.";

  try { const saved = localStorage.getItem("fieldnotes.lang"); if (saved) $("lang").value = saved; } catch {}
  $("lang").addEventListener("change", () => { try { localStorage.setItem("fieldnotes.lang", $("lang").value); } catch {} });

  if (!SR) $("recHint").textContent = HINT_NO_SR;

  // Screen wake lock: the app holds the screen awake by itself while recording,
  // because the OS suspends the page (and transcription) the moment the phone locks.
  let wakeLock = null;
  const canWake = !!(navigator.wakeLock && navigator.wakeLock.request);
  async function acquireWake() {
    if (!canWake) return;
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch { wakeLock = null; }
  }
  function releaseWake() { try { wakeLock?.release(); } catch {} wakeLock = null; }

  // If the page was hidden (lock button, app switch), transcription was suspended:
  // on return, re-grab the wake lock and respawn the recognizer so capture resumes.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && recording) {
      acquireWake();
      if (rec) { try { rec.onend = null; rec.stop(); } catch {} rec = null; }
      try { spinUpRecognizer(); } catch {}
    }
  });

  $("bigmic").addEventListener("click", () => {
    if (recording) stopRecording();
    else if (SR) startRecording();
    else startReview("", 0, "typed"); // no speech API: jump straight to a typed note
  });

  $("btnDim").addEventListener("click", () => { $("dimmer").hidden = false; });
  $("dimmer").addEventListener("click", () => { $("dimmer").hidden = true; });

  function startRecording() {
    finalText = ""; $("live").textContent = "";
    recording = true; recStart = Date.now();
    $("bigmic").classList.add("recording");
    $("micring").classList.add("recording");
    $("micIcon").hidden = true; $("stopIcon").hidden = false;
    $("bigmic").setAttribute("aria-label", "Stop recording");
    $("recHint").textContent = canWake
      ? "Recording. The screen stays awake automatically — use Dim for a near-dark screen."
      : "Recording. Keep the screen on — transcription pauses if the phone locks.";
    $("btnDim").hidden = false;
    timerIv = setInterval(() => {
      const t = fmtDur((Date.now() - recStart) / 1000);
      $("timer").textContent = t;
      $("dimTimer").textContent = t;
    }, 400);
    acquireWake();
    spinUpRecognizer();
  }

  function spinUpRecognizer() {
    rec = new SR();
    rec.lang = $("lang").value;
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { const t = r[0].transcript.trim(); if (t) finalText += t + " "; }
        else interim += r[0].transcript;
      }
      const el = $("live");
      el.textContent = finalText + interim;
      el.scrollTop = el.scrollHeight;
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        stopRecording();
        toast("Microphone access was blocked. Allow it in your browser settings.");
      }
    };
    rec.onend = () => { if (recording) { try { spinUpRecognizer(); } catch {} } };
    try { rec.start(); } catch {}
  }

  function stopRecording() {
    recording = false;
    clearInterval(timerIv);
    releaseWake();
    $("dimmer").hidden = true;
    $("btnDim").hidden = true;
    if (rec) { try { rec.onend = null; rec.stop(); } catch {} rec = null; }
    $("bigmic").classList.remove("recording");
    $("micring").classList.remove("recording");
    $("micIcon").hidden = false; $("stopIcon").hidden = true;
    $("bigmic").setAttribute("aria-label", "Start recording");
    const dur = (Date.now() - recStart) / 1000;
    $("timer").textContent = "00:00";
    startReview(finalText.trim(), dur, "voice");
  }

  // ---------- shared note formatting ----------
  const actionLabel = (a) => {
    const extra = [a.owner, a.due].filter(Boolean).join(" · ");
    return a.text + (extra ? `  (${extra})` : "");
  };
  const liHTML = (arr) => arr.map((t) => `<li>${esc(t)}</li>`).join("");

  function aiSectionsHTML(n) {
    let out = `<h4>Summary${n.type ? ` · ${esc(n.type)}` : ""}</h4><p>${esc(n.summary)}</p>`;
    if (n.outline?.length) out += `<h4>Full notes</h4><ul>${liHTML(n.outline)}</ul>`;
    if (n.decisions?.length) out += `<h4>Decisions</h4><ul>${liHTML(n.decisions)}</ul>`;
    if (n.actions?.length) out += `<h4>Action items</h4><ul>${liHTML(n.actions.map(actionLabel))}</ul>`;
    if (n.openQuestions?.length) out += `<h4>Open questions</h4><ul>${liHTML(n.openQuestions)}</ul>`;
    if (n.risks?.length) out += `<h4>Risks &amp; blockers</h4><ul>${liHTML(n.risks)}</ul>`;
    if (n.quotes?.length) out += `<h4>On record</h4><ul>${liHTML(n.quotes)}</ul>`;
    if (n.tangents?.length) out += `<h4>Off topic / parked</h4><ul>${liHTML(n.tangents)}</ul>`;
    if (n.tags?.length) out += `<div class="chips" style="margin-top:10px">${n.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>`;
    return out;
  }

  function noteMarkdown(n) {
    const sec = (h, arr, map) => (arr && arr.length ? `\n## ${h}\n` + arr.map(map || ((t) => `- ${t}`)).join("\n") + "\n" : "");
    return `# ${n.title || "Untitled note"}\n${fmtDate(n.createdAt)}${n.durationSec ? " · " + fmtDur(n.durationSec) : ""}${n.type ? " · " + n.type : ""}\n` +
      (n.summary ? `\n${n.summary}\n` : "") +
      sec("Notes", n.outline) +
      sec("Decisions", n.decisions) +
      sec("Action items", n.actions, (a) => `- [${a.done ? "x" : " "}] ${actionLabel(a)}`) +
      sec("Open questions", n.openQuestions) +
      sec("Risks & blockers", n.risks) +
      sec("On record", n.quotes, (q) => `- "${q}"`) +
      sec("Off topic / parked", n.tangents);
  }

  async function copyText(text, doneMsg) {
    try { await navigator.clipboard.writeText(text); toast(doneMsg); }
    catch {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove(); toast(doneMsg);
      } catch { toast("Copy failed in this browser."); }
    }
  }

  // ---------- review & AI notes ----------
  let reviewData = null;

  function startReview(transcript, durationSec, source) {
    reviewData = { transcript, durationSec, source, ai: null };
    $("capture").hidden = true;
    $("review").hidden = false;
    $("rvTitle").value = "";
    $("rvTranscript").value = transcript;
    $("aiPreview").hidden = true; $("aiMsg").hidden = true;
    $("aiOut").innerHTML = "";
    $("btnAI").hidden = !sampleFn;
    $("btnAI").disabled = false; $("btnAI").textContent = "✦ AI Analysis";
    if (source === "typed") $("rvTranscript").focus();
  }
  function endReview() {
    reviewData = null;
    $("review").hidden = true;
    $("capture").hidden = false;
    $("live").textContent = "";
    $("recHint").textContent = SR ? HINT_READY : HINT_NO_SR;
  }

  $("btnDiscard").addEventListener("click", () => {
    const txt = $("rvTranscript").value.trim();
    if (txt && !confirm("Discard this note?")) return;
    endReview();
  });

  $("btnAI").addEventListener("click", async () => {
    if (!sampleFn) return;
    const transcript = $("rvTranscript").value.trim();
    if (!transcript) { toast("Nothing to summarize yet."); return; }
    const btn = $("btnAI");
    btn.disabled = true; btn.textContent = "Analysing…";
    $("aiMsg").hidden = true;
    const deep = transcript.length > 3000;
    if (deep) btn.textContent = "Deep analysis…";
    try {
      const strArr = (v, cap) => (Array.isArray(v) ? v.map((t) => String(t)).filter(Boolean).slice(0, cap) : []);
      const j = await sampleFn.json(
        `You are an expert minute-taker and chief of staff, producing the definitive written record of a ` +
        `RAW speech-to-text transcript. Expect noise: mis-heard words, cut-off fragments, filler, several ` +
        `unlabelled speakers talking over each other, background chatter, and off-topic tangents. Use context ` +
        `to infer what was actually meant; silently drop filler and crosstalk; correct obvious mis-recognitions ` +
        `from context. Follow the discussion's MAIN thread even when it wanders off topic and comes back.\n\n` +
        `Non-negotiable quality rules:\n` +
        `1. COMPLETENESS — the outline must cover EVERY topic actually discussed, in order. A reader who was ` +
        `not there should lose nothing by reading your notes instead of the transcript.\n` +
        `2. FIDELITY — preserve every number, dollar amount, percentage, date, deadline, person's name and ` +
        `system name EXACTLY as said. Never round, rename or paraphrase them.\n` +
        `3. NO INVENTION — nothing the transcript doesn't support. If a passage is too garbled to interpret, ` +
        `omit it rather than guess.\n` +
        `4. DECISIONS carry their rationale when one was given ("X, because Y").\n` +
        `5. ACTION ITEMS are imperative and specific, with owner and due date when stated, null when not.\n\n` +
        `Reply with ONLY this JSON object:\n` +
        `{"title": string (max 8 words, plain),\n` +
        ` "type": "meeting" | "call" | "idea" | "task" | "memo",\n` +
        ` "summary": string (3-6 sentences: main thread, outcome, what happens next),\n` +
        ` "outline": string[] (the full notes — one line per point as "Topic — what was said/agreed", in order ` +
        `discussed, covering everything; for a short simple note a few lines is fine),\n` +
        ` "decisions": string[] (decisions actually made, with rationale when given; empty if none),\n` +
        ` "action_items": [{"task": string, "owner": string|null, "due": string|null}] (empty if none),\n` +
        ` "open_questions": string[] (raised but not answered; empty if none),\n` +
        ` "risks": string[] (risks, blockers or concerns raised; empty if none),\n` +
        ` "quotes": string[] (verbatim lines worth keeping on record — commitments, figures, exact wording ` +
        `that matters; empty if none),\n` +
        ` "tangents": string[] (one line each for off-topic threads worth remembering; empty if none),\n` +
        ` "tags": string[] (1-4 short lowercase topic words)}\n\n` +
        `Transcript:\n"""\n${transcript.slice(0, 40000)}\n"""`,
        { modelTier: deep ? "complex" : "default" }
      );
      const ai = {
        title: String(j?.title || "").slice(0, 120),
        type: ["meeting", "call", "idea", "task", "memo"].includes(j?.type) ? j.type : "",
        summary: String(j?.summary || ""),
        outline: strArr(j?.outline, 60),
        decisions: strArr(j?.decisions, 20),
        actions: (Array.isArray(j?.action_items) ? j.action_items : []).slice(0, 25).map((t) =>
          typeof t === "object" && t !== null
            ? { text: String(t.task || ""), owner: t.owner ? String(t.owner) : "", due: t.due ? String(t.due) : "", done: false }
            : { text: String(t), owner: "", due: "", done: false }
        ).filter((a) => a.text),
        openQuestions: strArr(j?.open_questions, 15),
        risks: strArr(j?.risks, 15),
        quotes: strArr(j?.quotes, 12),
        tangents: strArr(j?.tangents, 10),
        tags: strArr(j?.tags, 4).map((t) => t.toLowerCase()),
      };
      reviewData.ai = ai;
      if (ai.title && !$("rvTitle").value.trim()) $("rvTitle").value = ai.title;
      $("aiOut").innerHTML = aiSectionsHTML(ai);
      $("aiPreview").hidden = false;
      btn.textContent = "↻ Regenerate";
    } catch (e) {
      if (e && AI_GONE.has(e.code)) { sampleFn = null; btn.hidden = true; }
      const msg = copyFor(e && e.code);
      if (msg) { $("aiMsg").textContent = msg; $("aiMsg").hidden = false; }
      btn.textContent = "✦ AI Analysis";
    } finally {
      btn.disabled = false;
    }
  });

  $("btnSave").addEventListener("click", async () => {
    const transcript = $("rvTranscript").value.trim();
    if (!transcript) { toast("Nothing to save yet — record or type something first."); return; }
    const ai = reviewData?.ai;
    const note = {
      id: uid(),
      title: $("rvTitle").value.trim() || (ai && ai.title) || transcript.split(/\s+/).slice(0, 6).join(" "),
      transcript,
      type: (ai && ai.type) || "",
      summary: (ai && ai.summary) || "",
      outline: (ai && ai.outline) || [],
      decisions: (ai && ai.decisions) || [],
      actions: (ai && ai.actions) || [],
      openQuestions: (ai && ai.openQuestions) || [],
      risks: (ai && ai.risks) || [],
      quotes: (ai && ai.quotes) || [],
      tangents: (ai && ai.tangents) || [],
      tags: (ai && ai.tags) || [],
      createdAt: new Date().toISOString(),
      durationSec: Math.round(reviewData?.durationSec || 0),
      source: reviewData?.source || "voice",
    };
    $("btnSave").disabled = true;
    const ok = await saveNote(note);
    $("btnSave").disabled = false;
    if (ok) { endReview(); setTab("notes"); toast("Note saved"); }
  });

  // ---------- Ask ----------
  const turns = [];
  let askCtl = null;

  function notesContext() {
    let budget = 26000;
    const parts = [];
    for (const n of notes) {
      const actions = (n.actions || []).map((a) => `- ${a.done ? "[done] " : "[open] "}${actionLabel(a)}`).join("\n");
      const decisions = (n.decisions || []).map((d) => `- decided: ${d}`).join("\n");
      const points = (n.outline || n.keyPoints || []).map((p) => `- ${p}`).join("\n");
      const extras = [...(n.openQuestions || []).map((q) => `- open question: ${q}`), ...(n.risks || []).map((r) => `- risk: ${r}`)].join("\n");
      const chunk = `### ${n.title || "Untitled"} (${fmtDate(n.createdAt)})\n${n.summary ? n.summary + "\n" : ""}${points ? points + "\n" : ""}${decisions ? decisions + "\n" : ""}${actions ? actions + "\n" : ""}${extras ? extras + "\n" : ""}Transcript: ${String(n.transcript || "").slice(0, 800)}\n`;
      if (budget - chunk.length < 0) break;
      budget -= chunk.length;
      parts.push(chunk);
    }
    return parts.join("\n") || "(no notes saved yet)";
  }

  function addBubble(cls, text) {
    const div = document.createElement("div");
    div.className = "bubble " + cls;
    div.textContent = text;
    $("chatlog").appendChild(div);
    div.scrollIntoView({ block: "end" });
    return div;
  }

  async function sendAsk() {
    const q = $("askInput").value.trim();
    if (!q) return;
    if (!sampleFn) { toast("Ask needs Claude — open this app from claude.ai."); return; }
    $("askInput").value = "";
    $("askEmpty").hidden = true;
    addBubble("user", q);
    turns.push({ role: "user", content: q });
    const bubble = addBubble("ai", "Thinking…");
    $("askSend").hidden = true; $("askStop").hidden = false;
    askCtl = new AbortController();
    const RULES = `You are the "Ask" feature of a personal voice-notes app. Answer the user's question using ONLY their saved notes below. Be concise and specific; cite note titles when useful. Today is ${new Date().toDateString()}. If the notes don't contain the answer, say so plainly.\n\nSAVED NOTES:\n${notesContext()}`;
    try {
      const { text } = await sampleFn([{ role: "user", content: RULES }, ...turns.slice(-12)], {
        cache: false,
        signal: askCtl.signal,
        onText: ({ text }) => { bubble.textContent = text; bubble.scrollIntoView({ block: "end" }); },
      });
      turns.push({ role: "assistant", content: text });
    } catch (e) {
      if (e && AI_GONE.has(e.code)) sampleFn = null;
      if (e && e.text) { bubble.textContent = e.text; turns.push({ role: "assistant", content: e.text }); }
      else if (e && e.code === "cancelled") bubble.remove();
      else bubble.textContent = copyFor(e && e.code) || "Something went wrong.";
    } finally {
      $("askSend").hidden = false; $("askStop").hidden = true;
      askCtl = null;
    }
  }
  $("askSend").addEventListener("click", sendAsk);
  $("askInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendAsk(); });
  $("askStop").addEventListener("click", () => askCtl?.abort());

  // ---------- boot ----------
  async function initSample() {
    try { sampleFn = window.claude?.use ? await claude.use("sample") : null; } catch { sampleFn = null; }
    if (!sampleFn) {
      $("askEmpty").innerHTML = "Ask and AI analysis need Claude.<br>Open this app from its claude.ai link to enable them.";
    }
    if (reviewData) $("btnAI").hidden = !sampleFn;
  }

  setTab("record");
  renderNotes();
  updateBadge();
  initStorage();
  initSample();
})();
</script>
